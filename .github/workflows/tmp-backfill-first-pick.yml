name: Temporary first-pick backfill
# One-off run of scripts/backfill-first-pick.mjs on this branch (Gol.gg answers GitHub runners only). Removed before merge.
on:
  push:
    branches: [claude/project-thread-v05iqz]
    paths: [.github/workflows/tmp-backfill-first-pick.yml]
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/backfill-first-pick.mjs
      - name: Commit data
        if: always()
        run: |
          git add data/pro-games.json data/pro-builds.json
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git -c user.name="adequate-alan" -c user.email="54249725+adequate-alan@users.noreply.github.com" commit -m "Backfill which side picked first in every stored game" -m "Read from each game's Gol.gg page by scripts/backfill-first-pick.mjs on the GitHub runner." -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01VdfHpFovDkRAU61itnMjzc"
          git push
