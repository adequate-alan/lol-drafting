name: Refresh patch notes

# Daily check of Riot's official League of Legends patch notes (leagueoflegends.com) for new patches from 26.16 on, for
# corrections to a published patch (the article's revision changed) and for mid-patch updates. Summoner's Rift content
# only. Commits data/patch-notes.json and deploys only when that content changed; a refused or failed request writes
# nothing. Earlier patches stay in the archive. Saved pairings, pool tiers and recommendations are never touched.
#
# 8:47 AM Eastern all year, half an hour after the pro-data refresh (minute 47 keeps off the busy top and half hour; GitHub
# starts those late under load): both 12:47 and 13:47 UTC are scheduled and the gate
# step lets through only the one matching New York's current offset. GitHub may start scheduled runs late.
on:
  schedule:
    - cron: "47 12 * * *"
    - cron: "47 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check and report only; write and commit nothing"
        type: boolean
        default: false
      force:
        description: "Re-read every tracked patch even when its revision is unchanged"
        type: boolean
        default: false

permissions:
  contents: write # commit refreshed patch notes
  actions: write # start the Pages deploy (a push made with GITHUB_TOKEN does not trigger workflows)
  issues: write # the dpm-stale issue when the DPM.LOL counter data is from an older patch

concurrency:
  group: refresh-patch-notes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - id: gate
        name: Run at 8:47 AM Eastern only
        run: |
          offset=$(TZ=America/New_York date +%z)
          run=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "47 12 * * *" ] && [ "$offset" != "-0400" ]; then run=false; fi
            if [ "${{ github.event.schedule }}" = "47 13 * * *" ] && [ "$offset" != "-0500" ]; then run=false; fi
          fi
          echo "New York offset $offset; run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: refresh
        if: steps.gate.outputs.run == 'true'
        name: Check Riot's patch notes
        run: node scripts/refresh-patch-notes.mjs ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.force && '--force' || '' }}

      - if: steps.refresh.outputs.changed == 'true' && !inputs.dry_run
        run: npm ci
      - if: steps.refresh.outputs.changed == 'true' && !inputs.dry_run
        run: npm test
      - if: steps.refresh.outputs.changed == 'true' && !inputs.dry_run
        run: npm run typecheck
      - if: steps.refresh.outputs.changed == 'true' && !inputs.dry_run
        run: npm run build

      # Kit review queue (alan, 2026-10-22): champions whose changes touch their stored kit values, for a person to recheck.
      # Summary only; it never edits a kit or anything that scores.
      - if: steps.gate.outputs.run == 'true'
        name: Kit review queue
        run: |
          [ -d node_modules ] || npm ci
          npx tsx scripts/kit-review.ts | tee -a "$GITHUB_STEP_SUMMARY"

      # DPM.LOL counter freshness (alan, 2026-10-22): the counters are a browser collection for one patch (scripts/dpm-collect/).
      # The day a newer patch is recognised, one issue labelled dpm-stale tells alan to collect again; it is closed on its
      # own once fresh rows are stored. Summary and issue only: nothing here edits data, kits or anything that scores.
      - id: dpm
        if: steps.gate.outputs.run == 'true'
        name: DPM counter freshness
        run: |
          [ -d node_modules ] || npm ci
          npx tsx scripts/dpm-freshness.ts | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.dpm.outcome == 'success' && !inputs.dry_run
        name: Notify when the DPM data is from an older patch
        env:
          GH_TOKEN: ${{ github.token }}
          STALE: ${{ steps.dpm.outputs.stale }}
          DPM_PATCH: ${{ steps.dpm.outputs.dpm_patch }}
          NEWEST: ${{ steps.dpm.outputs.newest_patch }}
          COLLECTED: ${{ steps.dpm.outputs.collected }}
        run: |
          gh label create dpm-stale --description "DPM.LOL counter data is from an older patch" --color D93F0B 2>/dev/null || true
          open=$(gh issue list --label dpm-stale --state open --json number --jq '.[].number')
          if [ "$STALE" = "true" ]; then
            if [ -z "$open" ]; then
              gh issue create --label dpm-stale --title "DPM.LOL counters are from patch $DPM_PATCH; $NEWEST is current" \
                --body "The stored lane matchups (data/counters.json) were collected on $COLLECTED for patch $DPM_PATCH, and patch $NEWEST is now the newest the site recognises. Every Counter from this data is marked \"older patch\" on the site; strength and scoring are unchanged. To refresh: collect in the browser (scripts/dpm-collect/README.md), then dpm-validate, dpm-compare and ingest-dpm. This issue closes itself once fresh rows are stored."
              echo "Opened the dpm-stale issue."
            else
              echo "A dpm-stale issue is already open: #$open"
            fi
          elif [ -n "$open" ]; then
            for n in $open; do gh issue close "$n" --comment "The stored DPM.LOL counters are from the newest recognised patch ($DPM_PATCH, collected $COLLECTED)."; done
          fi

      - id: commit
        if: steps.refresh.outputs.changed == 'true' && !inputs.dry_run
        name: Commit refreshed patch notes
        run: |
          git config user.name "adequate-alan"
          git config user.email "54249725+adequate-alan@users.noreply.github.com"
          git add data/patch-notes.json
          git diff --cached --quiet && { echo "Nothing staged."; exit 0; }
          git commit -m "Patch notes: daily Riot check $(date -u +%Y-%m-%d)" -m "$(node -e 'const p=require("./data/patch-notes.json");console.log(p.patches.slice(0,3).map(x=>`${x.patch} (${x.short}): ${x.entries.length} entries${x.midPatch.length?`, mid-patch ${x.midPatch.length}`:""}`).join("\n"))')"
          for i in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && { echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; }
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1

      - if: steps.commit.outputs.pushed == 'true' && github.ref_name == 'main'
        name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
