name: Temporary fetch (Pro Builds research)

# One-off: reads two Gol.gg build pages and Data Dragon reference files from a GitHub runner (the cloud dev environment
# cannot reach either) and commits them to this branch for inspection. Removed before merge.
on:
  push:
    branches: [claude/project-thread-50uza9]
    paths: [.github/workflows/tmp-fetch-builds.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p tmp-fetch
          UA="lol-drafting-refresh/1.0 (+https://github.com/adequate-alan/lol-drafting; daily, a few pages)"
          g() { curl -sS -A "$UA" -o "tmp-fetch/$1" -w "$1 %{http_code} %{size_download}\n" "$2"; sleep 3; }
          curl -sS -A "$UA" -o tmp-fetch/robots.txt https://gol.gg/robots.txt; sleep 3
          p() { curl -sS -A "$UA" -X POST -H "Content-Type: application/x-www-form-urlencoded" -H "X-Requested-With: XMLHttpRequest" -e "https://gol.gg/game/stats/$2/page-builds/" --data "game_id=$2&player_id=$3" -o "tmp-fetch/$1" -w "$1 %{http_code} %{size_download}\n" "$4"; sleep 3; }
          p build-83452-4918-a.json 83452 4918 https://gol.gg/game/stats/83452/page-builds/ajax.build.php
          p build-83452-4918-b.json 83452 4918 https://gol.gg/game/ajax.build.php
          p build-83452-4925.json 83452 4925 https://gol.gg/game/stats/83452/page-builds/ajax.build.php
          p build-83452-799.json 83452 799 https://gol.gg/game/stats/83452/page-builds/ajax.build.php
          ls -la tmp-fetch
      - name: Commit
        run: |
          git config user.name "adequate-alan"
          git config user.email "54249725+adequate-alan@users.noreply.github.com"
          git add tmp-fetch
          git rm -q --cached tmp-fetch/championFull.json tmp-fetch/item.json 2>/dev/null || true
          git commit -m "Temporary: Gol.gg build pages and Data Dragon reference for inspection"
          git push origin HEAD:${GITHUB_REF_NAME}
