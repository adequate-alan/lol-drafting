name: Temporary fetch (Pro Builds backfill)

# One-off: backfills player builds for the recorded games from a GitHub runner (the cloud dev environment cannot reach
# Gol.gg or Data Dragon) and commits them to this branch. Removed before merge.
on:
  push:
    branches: [claude/project-thread-50uza9]
    paths: [.github/workflows/tmp-fetch-builds.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check icon paths
        run: |
          for u in https://ddragon.leagueoflegends.com/cdn/img/perk-images/StatMods/StatModsAttackSpeedIcon.png \
                   https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/7204_Resolve.png \
                   https://ddragon.leagueoflegends.com/cdn/16.18.1/img/spell/YorickQ.png \
                   https://ddragon.leagueoflegends.com/cdn/16.18.1/img/item/6665.png; do
            curl -sS -o /dev/null -w "%{http_code} $u\n" "$u"; done | tee tmp-icons.txt
      - name: Backfill builds
        run: node scripts/refresh-pro-data.mjs --builds-only
      - name: Commit
        run: |
          git config user.name "adequate-alan"
          git config user.email "54249725+adequate-alan@users.noreply.github.com"
          rm -rf tmp-fetch
          git add -A tmp-fetch data/pro-builds.json data/build-assets.json tmp-icons.txt
          git commit -m "Pro builds: backfill player builds for recorded games from Gol.gg"
          git push origin HEAD:${GITHUB_REF_NAME}
