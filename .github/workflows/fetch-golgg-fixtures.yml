name: Fetch Gol.gg fixtures

# Temporary: saves a handful of Gol.gg pages as test fixtures for the pro-data updater. Plain GETs, a few seconds apart.
on:
  push:
    branches: ["claude/daily-pro-data-refresh-*"]
    paths: [".github/workflows/fetch-golgg-fixtures.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          UA="lol-drafting-refresh/1.0 (+https://github.com/adequate-alan/lol-drafting)"
          D=tests/fixtures/golgg/raw; mkdir -p $D
          get() { echo "$2"; curl -sS -A "$UA" --max-time 30 -o "$D/$1" -w ' %{http_code}\n' "$2"; sleep 3; }
          T="Demacia%20Cup%20Global%20Invitational%202026"
          get tournament-list.html "https://gol.gg/tournament/list/"
          get demacia-matchlist.html "https://gol.gg/tournament/tournament-matchlist/$T/"
          get demacia-championlist.html "https://gol.gg/champion/list/season-ALL/split-ALL/tournament-$T/"
          get demacia-picksandbans.html "https://gol.gg/tournament/tournament-picksandbans/$T/"
          get game-83540-summary.html "https://gol.gg/game/stats/83540/page-summary/"
          get game-83540-game.html "https://gol.gg/game/stats/83540/page-game/"
          get game-83452-game.html "https://gol.gg/game/stats/83452/page-game/"
          get game-83578-preview.html "https://gol.gg/game/stats/83578/page-preview/"
          curl -sS -A "$UA" --max-time 30 -o $D/trlist-s16.json -X POST -d "season=S16" "https://gol.gg/tournament/ajax.trlist.php"; sleep 3
          for n in "World%20Championship%202026" "Worlds%202026" "Worlds%20Main%20Event%202026" "Worlds%20Play-In%202026"; do
            get "worlds-$n.html" "https://gol.gg/tournament/tournament-matchlist/$n/"
            grep -oiE '<title>[^<]*</title>' "$D/worlds-$n.html" || true
          done
          grep -oiE "World[^<\"']{0,40}2026" $D/tournament-list.html $D/trlist-s16.json | sort -u | head -20 || true
          ls -la $D
      - name: Commit
        run: |
          git config user.name "adequate-alan"
          git config user.email "54249725+adequate-alan@users.noreply.github.com"
          git add tests/fixtures/golgg/raw
          git commit -m "Raw Gol.gg pages for updater fixtures (temporary)"
          git push
