name: Sync champion roster

# Adds champions from Riot's Data Dragon that data/champions.json is missing (scripts/sync-champions.mjs) and commits
# the result to the branch it ran on. Run it from the Actions tab on a branch, then open a PR; Data Dragon is not
# reachable from Claude's environments, so the roster is fetched here.
on:
  workflow_dispatch:
  push:
    branches: ["claude/all-champions-*"]
    paths: ["scripts/sync-champions.mjs", ".github/workflows/sync-champions.yml"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-champions.mjs
      - name: Commit new champions
        run: |
          git diff --quiet data/champions.json && { echo "Roster already complete."; exit 0; }
          git config user.name "adequate-alan"
          git config user.email "54249725+adequate-alan@users.noreply.github.com"
          git add data/champions.json
          git commit -m "Add missing champions from Data Dragon (roster-only, attributes not reviewed)"
          git push
