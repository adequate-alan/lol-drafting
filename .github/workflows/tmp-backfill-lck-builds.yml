name: Temporary LCK builds backfill
# One-off run of scripts/backfill-lck-builds.mjs on this branch (Gol.gg answers GitHub runners only). Removed before merge.
on:
  push:
    branches: [claude/project-thread-50uza9]
    paths: [.github/workflows/tmp-backfill-lck-builds.yml]
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/backfill-lck-builds.mjs
      - name: Commit data
        run: |
          git add data/pro-builds.json data/build-assets.json
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git -c user.name="adequate-alan" -c user.email="54249725+adequate-alan@users.noreply.github.com" commit -m "Backfill Pro Builds for the LCK 2026 Season Playoffs games" -m "Read from Gol.gg by scripts/backfill-lck-builds.mjs on the GitHub runner." -m "Co-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>
Claude-Session: https://claude.ai/code/session_01JJeBPV7WTDh9Y2qHpui2kf"
          git push
