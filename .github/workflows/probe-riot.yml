name: Probe Riot patch notes (temporary)
on:
  push:
    branches: [claude/project-thread-uk3kvg]
    paths: [.github/workflows/probe-riot.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The real daily check, read-only: every tracked patch re-read, nothing written.
      - run: node scripts/refresh-patch-notes.mjs --dry-run --force
