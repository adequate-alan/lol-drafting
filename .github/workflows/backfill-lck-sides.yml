name: Backfill LCK sides (temporary)

# One-time run of scripts/backfill-lck-sides.mjs on this branch: reads the cited LCK playoff game pages from Gol.gg
# and commits the recovered sides to data/sources.json. Removed again before the branch is merged.
on:
  push:
    branches: [claude/design-system-cleanup-l059jt]
    paths: [".github/workflows/backfill-lck-sides.yml"]

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/backfill-lck-sides.mjs
      - name: Commit recovered sides
        run: |
          if git diff --quiet data/sources.json; then echo "No change."; exit 0; fi
          git -c user.name="adequate-alan" -c user.email="54249725+adequate-alan@users.noreply.github.com" \
            commit -m "Backfill LCK playoff sides from Gol.gg game pages" \
            -m "Co-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>" data/sources.json
          git push origin HEAD:claude/design-system-cleanup-l059jt
