name: Probe pro-data sources

# Temporary: checks whether Gol.gg and Leaguepedia answer plain requests from a GitHub-hosted runner.
# Prints status codes and page markers only; never retries around a challenge.
on:
  push:
    branches: ["claude/daily-pro-data-refresh-*"]
    paths: [".github/workflows/probe-pro-sources.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          UA="lol-drafting-refresh/1.0 (+https://github.com/adequate-alan/lol-drafting)"
          probe() {
            echo "=== $1"
            code=$(curl -sS -A "$UA" -o body.html -D headers.txt -w '%{http_code}' --max-time 30 "$1") || echo "curl failed"
            echo "status=$code bytes=$(wc -c < body.html 2>/dev/null)"
            grep -iE '^(server|cf-ray|cf-mitigated|content-type|retry-after):' headers.txt || true
            grep -oiE '<title>[^<]*</title>' body.html | head -1 || true
            grep -ciE 'challenge-platform|cf-chl|captcha|Just a moment' body.html || true
          }
          probe "https://gol.gg/robots.txt"; cat body.html | head -40
          probe "https://gol.gg/tournament/tournament-matchlist/Demacia%20Cup%20Global%20Invitational%202026/"
          probe "https://gol.gg/champion/list/season-ALL/split-ALL/tournament-Demacia%20Cup%20Global%20Invitational%202026/"
          probe "https://gol.gg/game/stats/83452/page-game/"
          probe "https://gol.gg/tournament/list/"
          grep -oE 'tournament-stats/[^"/]*(World|Demacia)[^"/]*' body.html | sort -u | head || true
          probe "https://lol.fandom.com/robots.txt"; head -30 body.html
          probe "https://lol.fandom.com/api.php?action=cargoquery&format=json&tables=Tournaments&fields=Name,OverviewPage,DateStart,Date&where=Year%3D2026%20AND%20(Name%20LIKE%20%22%25Worlds%25%22%20OR%20Name%20LIKE%20%22%25Demacia%25%22%20OR%20Name%20LIKE%20%22%25World%20Championship%25%22)&limit=50"
          cat body.html | head -c 3000; echo
          probe "https://lol.fandom.com/api.php?action=cargoquery&format=json&tables=ScoreboardGames&fields=GameId,OverviewPage,Team1,Team2,WinTeam,DateTime_UTC,Patch,Team1Picks,Team2Picks,Team1Bans,Team2Bans,MatchId,N_GameInMatch&where=OverviewPage%20LIKE%20%22%25Demacia%25%22&limit=3"
          cat body.html | head -c 3000; echo
