<!DOCTYPE html><html><body><script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"page": {"title": "Patch 26.19 Notes", "url": "https://www.leagueoflegends.com/en-us/news/game-updates/league-of-legends-patch-26-19-notes/", "displayedPublishDate": "2026-09-22T18:00:00.000Z", "analytics": {"contentId": "0ec98cab-47c6-4911-8aee-64a6a7364dbe.en-us", "contentLocale": "en-us", "rev": "5Qqn1BHjpykeOOQTvvZ7W3", "publishDate": "2026-09-22T18:00:00.000Z"}, "blades": [{"fragmentId": "26.19", "palette": "palette2", "richText": {"type": "html", "body": "<div id=\"patch-notes-container\"><h2 id=\"patch-top\">&nbsp;</h2><blockquote class=\"blockquote context\"><p>We're soon coming up on the Worlds patch (which is the patch <i>after</i> this one), so our first round of pro-focused Summoner's Rift changes are coming up here. We've identified some potential fringe picks for the tournament that could also provide some normal play variety without becoming disruptive with a nudge up in power, and knocking some individual meta outliers as well (and also Nasus). Systemically, the top lane role quest has been quite successful at freeing up top laners to skip Teleport, so we think increasing their map influence through that spell (both if you take it from the start of game or just through the quest) is a fair place to give the role some power.<br><br>Looking for more information on all things League of Legends? Check out our community-run wiki <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://wiki.leagueoflegends.com/en-us/\"><i>here</i></a><i>!</i><br><br>Wrong patch notes? You can find the <i>TFT patch notes </i><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://teamfighttactics.leagueoflegends.com/en-us/news/game-updates/teamfight-tactics-patch-18-3\"><i>here</i></a><i>!</i></p></blockquote><div class=\"context-designers\"><span class=\"context-designer\" style=\"text-align:left;\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/d7e6f8e9d6bd9dfb639083e670d4ab31bfb7dc03-143x148.png\"> Austin \"Riot wroadie\" Wright</span></div><div class=\"context-designers\"><span class=\"context-designer\" style=\"text-align:left;\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b36c216eac2e27319ed6c7a5df2dd25e449adee2-220x220.jpg\"> Erika \"Riot Cashmiir\" Haas</span></div><div class=\"context-designers\"><span class=\"context-designer\" style=\"text-align:left;\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/ca1ff9c14a7c22252e92199aec42db4e03d24806-300x300.jpg\"> Steven \"Riot sternest\" Earnest</span></div><header class=\"header-primary\"><h2 id=\"patch-patch-highlights\">Patch Highlights</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><p><a class=\"skins cboxElement\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/0d087ea8b3f39aa77e78c2909e8094f7d3670b51-1920x1080.png\"><span class=\"content-border\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/0d087ea8b3f39aa77e78c2909e8094f7d3670b51-1920x1080.png\"></span></a></p><blockquote class=\"blockquote context\"><p>Coven Janna, Coven Mel, Old God Anivia, Old God Urgot will be available September 23, 2026.</p></blockquote></div></div></div><header class=\"header-primary\"><h2 id=\"patch-team-voice\">Team Voice</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><blockquote class=\"blockquote context\"><p>First up, we wanted to share an update on the rollout of Team Voice, which is our planned expansion to the existing pre-made party voice chat allowing you to chat with everyone on your team. While we originally announced this as coming to North America and Oceania in Patch 26.20, after extensive testing, we've made the call to postpone this a bit to make sure we're hitting the quality bar you deserve for the experience. We don't have a target patch just yet, but we're prioritizing ironing out the kinks as efficiently as we can, since we know this is a long awaited feature we need to get right.</p></blockquote></div></div></div><header class=\"header-primary\"><h2 id=\"patch-champions\">Champions</h2></header><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/aatrox/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Aatrox.png\"></a></p><h3 class=\"change-title\" id=\"patch-aatrox\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/aatrox/\">Aatrox</a></h3><blockquote class=\"blockquote context\"><p>We think The Darkin Blade has lost a fair bit of power with Sundered Sky nerfs that were aimed more at opening up the jungle meta, so we are giving him a bump so he remains a world-ending threat.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/AatroxW.png\">W - Infernal Chains</h4><ul><li><strong>Cooldown</strong>: 20 / 18 / 16 / 14 / 12 seconds ⇒ <strong>18 / 16.5 / 15 / 13.5 / 12 seconds</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/AatroxE.png\">E - Umbral Dash</h4><ul><li><strong>Health Heal Ratio</strong>: 1.1% per 100 bonus health ⇒ <strong>1.3% per 100 bonus health</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/aphelios/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Aphelios.png\"></a></p><h3 class=\"change-title\" id=\"patch-aphelios\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/aphelios/\">Aphelios</a></h3><blockquote class=\"blockquote context\"><p>Aphelios has been kiting the spotlight for a while now, even though he's a hypercarry in an enchanter meta that should favor him, so we're looking to give him a little boost to encourage him to get out of his comfort zone.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/6360fc58cd4daba2dc9b4125424fdf160593f5ce-64x64.png\">Calibrum</h4><ul><li><strong>Moonshot Damage</strong>: 70 - 160 (+42 - 60% bonus AD) (+100% AP) ⇒ <strong>80 - 170 (+42 - 60% bonus AD) (+100% AP)</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3f47fc99f8f99d39d27b7162d3a4f65f419a90de-64x64.png\">Severum</h4><ul><li><strong>Healing</strong>: 2 - 7.1%, increased to 5 - 17.75% ⇒ <strong>2 - 8%, increased to 5 - 20%</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/2de6fe8a2477f2e41213136e7d61958491d5781a-64x64.png\">Gravitum</h4><ul><li><strong>Slow</strong>: 30% for 2.5 seconds, decaying to 10% after 0.7 seconds ⇒ <strong>30% for 2.5 seconds, decaying to 15% after 0.7 seconds</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b1f6d242158fe73dfbda64052edf530cfe19c517-64x64.png\">Infernum</h4><ul><li><strong>Duskwave Cooldown</strong>: 9 / 8.25 / 7.5 / 6.75 / 6 seconds ⇒ <strong>8 / 7.25 / 6.5 / 5.75 / 5 seconds</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f4b7c11ce37d875e0b45a4ef3cdd3b7cc6021623-64x64.png\">Crescendum</h4><ul><li><strong>Mini-Crescendum Damage</strong>: 15% AD, decreasing by 1.5% AD to a minimum of 5% AD for the 8th+ chakram ⇒ <strong>16% AD, decreasing by 1.5% AD to a minimum of 5% AD for the 9th+ chakram</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/aurora/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Aurora.png\"></a></p><h3 class=\"change-title\" id=\"patch-aurora\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/aurora/\">Aurora</a></h3><blockquote class=\"blockquote context\"><p>Despite not receiving any changes since last year, Aurora has fallen off as we've had to nerf Rocketbelt into a fairer state. We're giving our favorite Bryni a bit more power in her waveclear and outplay potential with her ultimate.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/AuroraE.png\">E - The Weirding</h4><ul><li><strong>Base Damage</strong>: 70 / 110 / 150 / 190 / 230 ⇒ <strong>80 / 120 / 160 / 200 / 240</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/AuroraR.png\">R - Between Worlds</h4><ul><li><strong>Rift Duration</strong>: 1.75 / 2.5 / 3.25 seconds ⇒ <strong>2.25 / 2.75 / 3.25 seconds</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/draven/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Draven.png\"></a></p><h3 class=\"change-title\" id=\"patch-draven\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/draven/\">Draven</a></h3><blockquote class=\"blockquote context\"><p>Since all bot laners received significantly increased gold income thanks to role quests, Draven's potential to gain a gold advantage through his Adoration stacks has lost some of its impact. We're giving him a helping hand (axe?) by tapping up his early game damage.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">Base Stats</h4><ul><li><strong>Attack Damage</strong>: 62 ⇒ <strong>64</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/elise/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Elise.png\"></a></p><h3 class=\"change-title\" id=\"patch-elise\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/elise/\">Elise</a></h3><blockquote class=\"blockquote context\"><p>This year started strong for AP junglers that could use Dusk and Dawn, but others like Elise have been in a weak spot for a while, so we are helping out our friendly neighborhood spider with clear speed and damage.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/passive/ElisePassive.png\">Passive - Spider Queen</h4><ul><li><strong>Passive Magic Damage On-Hit</strong>: 12 / 22 / 32 / 42 ⇒ <strong>14 / 24 / 34 / 44</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/EliseHumanW.png\">W - Skittering Frenzy</h4><ul><li><strong>Bonus Attack Speed</strong>: 60 / 75 / 90 / 105 / 120% ⇒ <strong>70 / 85 / 100 / 115 / 130%</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/fiora/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Fiora.png\"></a></p><h3 class=\"change-title\" id=\"patch-fiora\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/fiora/\">Fiora</a></h3><blockquote class=\"blockquote context\"><p>Our Grand Duelist has room to shine a bit more when she succeeds after finding her opening, without giving her sharper 1v1 tools.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">Base Stats</h4><ul><li><strong>Health Growth</strong>: 99 ⇒ <strong>105</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/FioraR.png\">R - Grand Challenge</h4><ul><li><strong>Heal Range</strong>: 550 ⇒ <strong>600</strong></li><li><strong>Heal Per Tick</strong>: 18.75 / 25 / 31.25 (+15% bonus AD) ⇒ <strong>20 / 26.25 / 32.5 (+17.5% bonus AD)</strong></li><li><strong>Maximum Heal</strong>: 375 / 500 / 625 (+300% bonus AD) ⇒ <strong>400 / 525 / 650 (+350% bonus AD)</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/khazix/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Khazix.png\"></a></p><h3 class=\"change-title\" id=\"patch-khazix\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/khazix/\">Kha'Zix</a></h3><blockquote class=\"blockquote context\"><p>Kha'Zix has been on the fringe of the meta now that the jungle is no longer dominated by Sundered Sky users. We are taking this opportunity to buff some of his weaker evolves to give him the flexibility to adapt and overcome.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/passive/Khazix_P.png\">Passive - Unseen Threat</h4><ul><li><strong>Damage</strong>: 17 - 136 (+50% bonus AD) ⇒ <strong>22 - 141 (+50% bonus AD)</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/KhazixW.png\">W - Void Spike</h4><ul><li><strong>Evolved Slow Duration</strong>: 2 seconds ⇒ <strong>2.25 seconds</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/KhazixE.png\">E - Leap</h4><ul><li><strong>Evolved Range Bonus</strong>: +200 ⇒ <strong>+300</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/lillia/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Lillia.png\"></a></p><h3 class=\"change-title\" id=\"patch-lillia\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/lillia/\">Lillia</a></h3><blockquote class=\"blockquote context\"><p>Lillia is on the edge of being viable at higher levels of play and we believe her current pattern requires her to get in danger's way, so we're helping her durability. We also want to give Lillia opportunities to really be a playmaker so we're making the enemies she lullabies a little extra sleepy.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">Base Stats</h4><ul><li><strong>Armor</strong>: 22 ⇒ <strong>24</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/LilliaR.png\">R - Lilting Lullaby</h4><ul><li><strong>Sleep Duration</strong>: 2 seconds ⇒ <strong>2.5 seconds</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/lucian/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Lucian.png\"></a></p><h3 class=\"change-title\" id=\"patch-lucian\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/lucian/\">Lucian</a></h3><blockquote class=\"blockquote context\"><p>Years ago, we added the Vigilance Passive so Lucian bot players didn't feel like their champ was being nerfed because of mid laners, which ended up being <i>super effective</i>. We think now is a good opportunity to adjust the tuning of the passive and strike a balance between both roles.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://ddragon.leagueoflegends.com/cdn/16.18.1/img/passive/Lucian_Passive.png\">Passive - Vigilance</h4><ul><li><strong>Empowered On-Hit Damage</strong>: 15 (+20% AD) ⇒ <strong>5 (+15% AD)</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/LucianQ.png\">Q - Piercing Light</h4><ul><li><strong>Base Damage</strong>: 80 / 115 / 150 / 185 / 220 (+100% bonus AD) ⇒ <strong>90 / 130 / 170 / 210 / 250 (+100% bonus AD)</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/masteryi/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/MasterYi.png\"></a></p><h3 class=\"change-title\" id=\"patch-masteryi\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/masteryi/\">Master Yi</a></h3><blockquote class=\"blockquote context\"><p>Somewhat overdue, but because Duskblade was removed a while ago, we're removing the Ability Haste penalty we had to apply to his Q CDR mechanic. This should have minimal impact on Summoner's Rift, but we see you Mayhem and Arena!</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/AlphaStrike.png\">Q - Alpha Strike</h4><ul><li><strong>Cooldown Refund on Hit</strong>: -1 second, scaling down with Ability Haste ⇒ <strong>1 second</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/nasus/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Nasus.png\"></a></p><h3 class=\"change-title\" id=\"patch-nasus\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/nasus/\">Nasus</a></h3><blockquote class=\"blockquote context\"><p>Nasus is difficult to keep down these days, and part of that is how quickly getting his early stacks leads to more reliable stacking. These higher highs will be compensated with some lower lows through some more vulnerability early on with lower damage and lifesteal lane sustain values off of that, and a bit longer before he really comes online.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/NasusQ.png\">Q - Siphoning Strike</h4><ul><li><strong>Bonus Damage</strong>: 40 / 60 / 80 / 100 / 120 ⇒ <strong>30 / 50 / 70 / 90 / 110</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/nocturne/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Nocturne.png\"></a></p><h3 class=\"change-title\" id=\"patch-nocturne\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/nocturne/\">Nocturne</a></h3><blockquote class=\"blockquote context\"><p>Nocturne has been a popular and powerful jungler in both pro and solo-queue for a while, so we're hitting the map presence and dueling power he benefits from through his ultimate.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/NocturneParanoia.png\">R - Paranoia</h4><ul><li><strong>Cooldown</strong>: 140 / 115 / 90 seconds ⇒ <strong>160 / 130 / 100 seconds</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/poppy/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Poppy.png\"></a></p><h3 class=\"change-title\" id=\"patch-poppy\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/poppy/\">Poppy</a></h3><blockquote class=\"blockquote context\"><p>Poppy's flex potential and jungle presence has been a bit problematic, suppressing many champions across the board as a strong counterpick. For this change, we're targeting her flexibility by reverting a previous buff to jungle clear.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/PoppyQ.png\">Q - Hammer Shock</h4><ul><li><strong>Minion/Monster Maximum Health Cap</strong>: 85 / 120 / 155 / 190 / 225 ⇒ <strong>70 / 105 / 140 / 175 / 210</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/rumble/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Rumble.png\"></a></p><h3 class=\"change-title\" id=\"patch-rumble\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/rumble/\">Rumble</a></h3><blockquote class=\"blockquote context\"><p>At higher levels of play, we've seen Rumble continue to take over games, even after our changes earlier this year designed to hit his power in lane. Here, we're making some modifications to his passive that's much more elite-skewed, while giving Rumble in the Jungle some compensation.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/passive/Rumble_JunkyardTitan1.png\">Passive - Junkyard Titan</h4><ul><li><strong>Overheat Attack Speed</strong>: 50 - 130% ⇒ <strong>30 - 100%</strong></li><li><strong>Monster Cap</strong>: 65 - 150 ⇒ <strong>90 - 175</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/ryze/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Ryze.png\"></a></p><h3 class=\"change-title\" id=\"patch-ryze\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/ryze/\">Ryze</a></h3><blockquote class=\"blockquote context\"><p>Between strong itemization options and best-in-class skirmish and roam potential demonstrated by his most skilled players, it's high time we put some restraints on the archmage, while giving him some help with bad solo queue matchups.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">Base Stats</h4><ul><li><strong>Armor Growth</strong>: 4.2 ⇒ <strong>4.7</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/RyzeQWrapper.png\">Q - Overload</h4><ul><li><strong>Flux Bonus Damage</strong>: 25 / 50 / 75 / 100% increased damage ⇒ <strong>15 / 40 / 65 / 90% increased damage</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/RyzeE.png\">E - Spell Flux</h4><ul><li><strong>Mana Cost</strong>: 35 / 45 / 55 / 65 / 75 ⇒ <strong>40 / 50 / 60 / 70 / 80</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/vi/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Vi.png\"></a></p><h3 class=\"change-title\" id=\"patch-vi\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/vi/\">Vi</a></h3><blockquote class=\"blockquote context\"><p>Vi has been a meta staple for the entire year, and now that Sundered Sky is in a better spot, we're going after her durability and early clear speed to make her a riskier pick who can still bring the pain if you are willing to build for it.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">Base Stats</h4><ul><li><strong>Attack Damage</strong>: 63 + 3.5/Level ⇒ <strong>61 + 3.9/Level</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/passive/ViPassive.png\">Passive - Blast Shield</h4><ul><li><strong>Shield</strong>: 12% Maximum Health ⇒ <strong>10% Maximum Health</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/volibear/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Volibear.png\"></a></p><h3 class=\"change-title\" id=\"patch-volibear\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/volibear/\">Volibear</a></h3><blockquote class=\"blockquote context\"><p>This year we've been carefully buffing up AD Volibear, but he remains on the weak side even with his very unique AP build. We're tuning him up to help him out across both the fringe AD build and his core AP build.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/passive/Volibear_Icon_P.png\">Passive - The Relentless Storm</h4><ul><li><strong>Attack Speed per Stack</strong>: 5% (+3% per 100 AP) ⇒ <strong>5% (+4% per 100 AP)</strong></li><li><strong>Lightning On-Hit Damage</strong>: 11 - 60 (Levels 1-18) (+45% AP) ⇒ <strong>11 - 60 (Levels 1-18) (+45% AP) (+20% bonus AD)</strong></li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-items\">Items</h2></header><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><h4 class=\"change-detail-title\">World Atlas and Runic Compass</h4><blockquote class=\"blockquote context\"><p>We think melee supports have too much of their power in roaming and all-ins and are too weak in sustained laning. In response, we're shifting the flat health to health regen on World Atlas and Runic Compass, which will benefit them more due to their higher base health regen values.</p></blockquote><hr class=\"divider\"><ul><li><strong>Health</strong>: 30 / 100 / 200 ⇒ <strong>0 / 60 / 200</strong></li><li><strong>Health Regeneration</strong>: 25% / 50% / 75% ⇒ <strong>50% / 75% / 75%</strong></li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-systems\">Systems</h2></header><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><h4 class=\"change-detail-title\">Teleport Cooldown</h4><blockquote class=\"blockquote context\"><p>As the meta has continued to adjust to role quests, it's become clear that top lane is slightly weak, especially for split pushing. We're in turn buffing the cooldown of both the free role quest Teleport and upgraded Unleashed Teleport to promote those alternative strategies.</p></blockquote><hr class=\"divider\"><ul><li><strong>Top Role Quest's Free Teleport Cooldown</strong>: 420 seconds ⇒ <strong>390 seconds</strong></li><li><strong>Top Role Quest's Upgraded Unleashed Teleport Cooldown</strong>: 330 - 240 seconds ⇒ <strong>300 - 210 seconds</strong></li><li><strong>Non-Top Unleashed Teleport Cooldown</strong>: 330 - 240 seconds ⇒ <strong>Unchanged</strong></li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-classic\">Classic</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><blockquote class=\"blockquote context\"><p>We've got our third big champion \"drop\" this patch (get it? They're water-themed) with four fresh faces and the highlight is a long-lost favorite, Graves! We've also got our first set of actions from the previous Council poll. Welcome back, Cloak and Dagger, Moonflair Spellblade, and Zz'Rot Portal.&nbsp;<br><br>Our fourth patch for Classic also contains more bugfixing, balance changes, and client quality. Check out those sweet new rune effects when you socket them in!</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">Champions</h4><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Fizz</strong></p><blockquote class=\"blockquote context\"><p>Fizz came out back in 2011 and was finally reworked in late 2016. Though many of you remember all his buttons being in the same place, he's got a missing HP bleed on his W passive, so maybe build a Sunfire Cape or two?</p></blockquote><p><strong>Passive - Nimble Fighter</strong></p><ul><li>Fizz can move through units and takes reduced damage from basic attacks.</li></ul><p><br><strong>Q - Urchin Strike</strong></p><ul><li>Fizz dashes a fixed distance through an enemy, damaging them and applying on-hit effects.</li></ul><p><br><strong>W - Seastone Trident</strong></p><ul><li>Passive: Fizz's basic attacks deal additional damage over time, scaling with his target's missing health.</li><li>Active: For the next few seconds, Fizz's basic attacks deal bonus damage on-hit and apply Grievous Wounds for a few seconds, reducing healing by 50%.</li></ul><p><br><strong>E - Playful/Trickster</strong></p><ul><li>First cast: Fizz hops up on his trident, becoming untargetable. After a short delay, he will crash down, damaging and slowing enemies around him.</li><li>Second cast: Fizz can hop off the trident early to dash farther but deal damage in a smaller area and doesn't slow.</li></ul><p><br><strong>R - Chum the Waters</strong></p><ul><li>Fizz throws out bait that clings onto the first enemy champion it hits. After a short delay, a mighty shark stalks its prey, dealing tons of damage, knocking up, and slowing enemies in the area.</li></ul><hr class=\"divider\"><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Graves</strong></p><blockquote class=\"blockquote context\"><p>Welcome back, pre-rework Graves! This version from 2011-2015 is a true-to-live bot lane ADC, rewarded for long duration fights and deadly burst damage against short-range enemies. Careful though, his bonus resists take time to stack up, so assassins can still jump you in the jungle.</p></blockquote><p><strong>Passive - True Grit</strong></p><ul><li>While in combat, Graves gains stacking Armor and Magic Resist every second, up to a cap.</li></ul><p><br><strong>Q - Buckshot</strong></p><ul><li>Graves fires out three bullets that damage all enemies in a line. Multiple hits on the same target deal reduced damage.</li></ul><p><br><strong>W - Smokescreen</strong></p><ul><li>Graves launches a smoke grenade that damages, slows, and nearsights enemies in an area.</li></ul><p><br><strong>E - Quickdraw</strong></p><ul><li>Graves dashes a short distance and gains bonus attack speed for several seconds. Basic attacks reduce Quickdraw's cooldown.</li></ul><p><br><strong>R - Collateral Damage</strong></p><ul><li>Graves fires an explosive shell that damages enemies in a line. It explodes on the first enemy champion hit, dealing reduced damage in a cone behind them.</li></ul><hr class=\"divider\"><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Nami</strong></p><blockquote class=\"blockquote context\"><p>Nami is back in action and not much has changed since her release in 2013. For those of you coming right from the modern game, her E buff is attack-only, so the modern Nami-Karthus synergy is gone.</p></blockquote><p><strong>Passive - Surging Tides</strong></p><ul><li>Allies struck by Nami's abilities briefly gain bonus move speed.</li></ul><p><br><strong>Q - Aqua Prison</strong></p><ul><li>Nami lobs a bubble that damages and stuns enemies where it lands.</li></ul><p><br><strong>W - Ebb and Flow</strong></p><ul><li>Nami unleashes a stream of water that bounces, alternating between enemies and allies. Enemies take damage while allies are healed. Each bounce is less effective than the hit before it.</li></ul><p><br><strong>E - Tidecaller's Blessing</strong></p><ul><li>Nami empowers an ally, causing their next three attacks to deal bonus damage and slow their target.</li></ul><p><br><strong>R - Tidal Wave</strong></p><ul><li>Nami unleashes a massive tidal wave that damages, knocks up, and slows all enemies it crashes into.</li></ul><hr class=\"divider\"><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Nautilus</strong></p><blockquote class=\"blockquote context\"><p>Nautilus came out back in 2012 and as with Nami, his kit has stood the test of time. Remember that you can buy multiple Doran's Rings if you want your laning phase to work out, and he used to be quite the jungler back in the day. The biggest difference you'll find is that his ultimate is much less disruptive to targets hit by the traveling portion.</p></blockquote><p><strong>Passive - Staggering Blow</strong></p><ul><li>Nautilus's basic attacks deal bonus damage and root their enemies. Each enemy can only be Staggered once every few seconds.</li></ul><p><br><strong>Q - Dredge Line</strong></p><ul><li>Nautilus throws out his anchor, colliding with the first enemy or piece of terrain it hits. Enemies are damaged and pulled in, while Nautilus pulls himself to his target. Hitting terrain refunds part of Dredge Line's cooldown.</li></ul><p><br><strong>W - Titan's Wrath</strong></p><ul><li>Nautilus gains a shield. While it holds, his attacks deal damage over time to enemies in the area.</li></ul><p><br><strong>E - Riptide</strong></p><ul><li>Nautilus slams the ground, sending out cascading shockwaves that damage and slow enemies. Enemies may be hit by multiple shockwaves, taking reduced damage for subsequent hits.</li></ul><p><br><strong>R - Depth Charge</strong></p><ul><li>Nautilus fires a shockwave into the earth that damages and knocks up enemies in its path. When it reaches his target, it damages, knocks up, and stuns all enemies in the immediate area.</li></ul><hr class=\"divider\"><p><strong>Akali</strong></p><blockquote class=\"blockquote context\"><p>As the dust has settled, Akali appears weak, so we're swinging by for some buffs. Crescent Slash can feel like it's a waste of energy, so we're both improving its late-game energy efficiency and its overall DPS, which are buffs from 2012 and 2015, respectively.</p></blockquote><p><strong>E - Crescent Slash</strong></p><ul><li><strong>Energy Cost</strong>: 60 / 60 / 60 / 60 / 60 ⇒ <strong>60 / 55 / 50 / 45 / 40</strong></li><li><strong>Cooldown</strong>: 7 / 6 / 5 / 4 / 3s ⇒ <strong>5 / 4 / 3 / 2 / 1s</strong></li><li><strong>Ability Power Ratio</strong>: 30% ⇒ <strong>40%</strong></li></ul><hr class=\"divider\"><p><strong>Fiora</strong></p><blockquote class=\"blockquote context\"><p>Fiora is doing far too well, so it's nerf time. First up, we're fixing several bugs and implementation mismatches compared to her 3.11 version, which is why you're seeing some low-impact changes here. For her balance, we're pulling in an adjustment from 2014 and reverting a buff from 2012. The change to her ultimate will deal similar damage to a single isolated target but weaken her AoE teamfighting.</p></blockquote><p><strong>W - Riposte</strong></p><ul><li><strong>Bugfix</strong>: Fixed a bug where the reflected damage could be blocked by enemies in the way.</li></ul><p><br><strong>R - Blade Waltz</strong></p><ul><li><strong>Damage</strong>: 160 / 330 / 500 (+115% bonus AD) ⇒ <strong>125 / 255 / 385 (+85% bonus AD)</strong></li><li><strong>Maximum Single Target Damage</strong>: 320 / 660 / 1000 (+230% bonus AD) ⇒ <strong>325 / 663 / 1001 (+221% bonus AD)</strong></li><li><strong>Cooldown</strong>: 130 / 120 / 110s ⇒ <strong>150 / 130 / 110s</strong></li><li><strong>Damage Timing</strong>: Starts dealing damage 0.25s later into the animation.</li><li><strong>Target Prioritization</strong>: Now always tries to prioritize unstruck enemies if possible.</li><li><strong>Maximum Return Range</strong>: 1500 ⇒ <strong>2500</strong></li><li><strong>Bugfix</strong>: Fixed a bug where Fiora could be locked out of attacking or moving for 2 seconds if her target immediately became untargetable.</li></ul><hr class=\"divider\"><p><strong>Galio</strong></p><blockquote class=\"blockquote context\"><p>While Fiora landed as pretty much the strongest champion in the game, Galio is arguably the weakest. We're delivering a huge swath of buffs and some bugfixes for his initial state.</p></blockquote><p><strong>W - Bulwark</strong></p><ul><li><strong>Bugfix</strong>: Fixed a bug where the first heal was receiving the -20% heal reduction.</li></ul><p><br><strong>E - Righteous Gust</strong></p><ul><li><strong>Cast Time</strong>: 0.4s ⇒ <strong>0.25s</strong></li><li><strong>Missile Speed</strong>: 1200 ⇒ <strong>1300</strong></li><li><strong>Missile Width</strong>: 60 ⇒ <strong>160</strong></li><li><strong>Missile Range</strong>: 1100 ⇒ <strong>1175</strong></li><li><strong>Bugfix</strong>: Fixed a bug where it was dealing 15 more damage than it should have.</li><li><strong>Bugfix</strong>: Fixed a bug where it was applying the wrong VFX on its target.</li></ul><hr class=\"divider\"><p><strong>Kassadin</strong></p><blockquote class=\"blockquote context\"><p>As we've buffed up the bottom end of the mid lane pool, Kassadin has wound up as the actual worst-performing mid laner. Our primary buff is increasing his Riftwalk range. Instead of using his formerly Dominion-only 600 max range, he's regaining his full Summoner's Rift 700 range Riftwalk. We're also shipping adjustments that adhere more closely to his tuning during Worlds 2013.</p></blockquote><p><strong>Q - Null Sphere</strong></p><ul><li><strong>Ability Power Ratio</strong>: 60% ⇒ <strong>70%</strong></li></ul><p><br><strong>E - Force Pulse</strong></p><ul><li><strong>Damage</strong>: 60 / 120 / 180 / 240 / 300 (+80% AP) ⇒ <strong>80 / 130 / 180 / 230 / 280 (+70% AP)</strong></li><li><strong>Slow</strong>: 20 / 30 / 40 / 50 / 60% ⇒ <strong>30 / 35 / 40 / 45 / 50%</strong></li></ul><p><br><strong>R - Riftwalk</strong></p><ul><li><strong>Range</strong>: 600 ⇒ <strong>700</strong></li></ul><hr class=\"divider\"><p><strong>Malphite</strong></p><blockquote class=\"blockquote context\"><p>We've got a few historical-accuracy changes and bugfixes for Malphite this patch. Crit AD Malphite now has sweet AoE damage and he no longer halves Dragon's attack speed. Infinity Edge is calling to you.</p></blockquote><p><strong>W - Brutal Strikes</strong></p><ul><li><strong>Splash Damage</strong>: Now crits if the main attack does.</li><li><strong>Activation</strong>: No longer interrupts Malphite's attack mid-swing.</li></ul><p><br><strong>E - Ground Slam</strong></p><ul><li><strong>Bugfix</strong>: Fixed a bug where it could slow Epic Monster attack speed.</li></ul><p><br><strong>R - Unstoppable Force</strong></p><ul><li><strong>Bugfix</strong>: Fixed a bug where Malphite could get locked out of casting Flash for too long.</li></ul><hr class=\"divider\"><p><strong>Morgana</strong></p><blockquote class=\"blockquote context\"><p>Morgana is one of the strongest mid laners in the game and is a little too good in support as well, so we're pushing in some mid-skewed nerfs by reverting some of her 2010-2012 era buffs and adjustments.</p></blockquote><p><strong>W - Tormented Soil</strong></p><ul><li><strong>Mana Cost</strong>: 70 / 85 / 100 / 115 / 130 ⇒ <strong>80 / 100 / 120 / 140 / 160</strong></li><li><strong>Cooldown</strong>: 10s ⇒ <strong>12s</strong></li></ul><p><br><strong>E - Black Shield</strong></p><ul><li><strong>Shield</strong>: 95 / 160 / 225 / 290 / 355 ⇒ <strong>100 / 150 / 200 / 250 / 300</strong></li></ul><p><br><strong>R - Soul Shackles</strong></p><ul><li><strong>Cooldown</strong>: 120 / 110 / 100s ⇒ <strong>120 / 120 / 120s</strong></li></ul><hr class=\"divider\"><p><strong>Nidalee</strong></p><blockquote class=\"blockquote context\"><p>We're putting in a few more historical-accuracy changes for Nidalee this patch. There won't be a huge power gain here, but it will allow oldschool expert Nidalee players to activate their old combos.</p></blockquote><p><strong>W - Bushwhack</strong></p><ul><li><strong>Vision</strong>: Now gives 250u of vision for 0.5s when cast.</li><li><strong>Damage Duration</strong>: 4s ⇒ <strong>2.5s</strong>. Total damage unchanged.</li></ul><p><br><strong>R - Aspect of the Cougar</strong></p><ul><li><strong>Attack Timer</strong>: Now resets Nidalee's basic attack timer.</li></ul><hr class=\"divider\"><p><strong>Poppy</strong></p><blockquote class=\"blockquote context\"><p>Poppy re-released fairly balanced but had a few bugs and oversights in her scripts. Both of these changes represent period-accurate power to Season Three and constitute small buffs.</p></blockquote><p><strong>Q - Devastating Blow</strong></p><ul><li><strong>Critical Strike</strong>: Now crits her total AD ratio if she crits.</li><li><strong>Spellblade Damage</strong>: Now converts all Spellblade damage to magic.</li><li><strong>Tooltip</strong>: Updated to clarify crit damage, damage cap, and the Spellblade interaction.</li></ul><hr class=\"divider\"><p><strong>Shyvana</strong></p><blockquote class=\"blockquote context\"><p>Shyvana isn't doing too hot, so it's time for buffs. We're leading with a revert of some nerfs from 2012, which should help her stay in step with her opponents.</p></blockquote><p><strong>W - Burnout</strong></p><ul><li><strong>Maximum Duration Extension</strong>: 4 ⇒ <strong>6</strong></li></ul><p><br><strong>R - Dragon's Descent</strong></p><ul><li><strong>Bonus Resistances</strong>: 10 / 15 / 20 ⇒ <strong>15 / 20 / 25</strong>, still doubled during dragon form.</li></ul><hr class=\"divider\"><p><strong>Twisted Fate</strong></p><blockquote class=\"blockquote context\"><p>Twisted Fate is too good in both mid and support, so it's nerf time. As support is the better-performing role, we're lowering his map-wide omnipresence and frontloading the nerfs. These nerfs come in the form of patch 3.7's Destiny cooldown and 1.0.0.75's Gate cooldown, the last time it was ever its own spell. We're also matching his passive's behavior with other global passives: It's disabled while he's dead.</p></blockquote><p><strong>Passive - Loaded Dice</strong></p><ul><li><strong>Bonus Gold While Dead</strong>: Allies no longer gain bonus gold while Twisted Fate is dead.</li></ul><p><br><strong>E - Gate</strong></p><ul><li><strong>Cooldown</strong>: 120 / 105 / 90 / 75 / 60s ⇒ <strong>135 / 120 / 105 / 90 / 75s</strong></li></ul><p><br><strong>R - Destiny</strong></p><ul><li><strong>Cooldown</strong>: 130 / 110 / 90s ⇒ <strong>180 / 150 / 120s</strong></li><li><strong>Mana Cost</strong>: 150 ⇒ <strong>150 / 125 / 100</strong></li></ul><hr class=\"divider\"><p><strong>Zilean</strong></p><blockquote class=\"blockquote context\"><p>Zilean has some small anachronisms in his cast paradigms and ability functionality, which we're fixing this patch.</p></blockquote><p><strong>Passive - Heightened Learning</strong></p><ul><li><strong>Bonus Experience While Dead</strong>: No longer grants bonus XP while Zilean is dead.</li></ul><p><br><strong>Q - Time Bomb</strong></p><ul><li><strong>Cast Visibility</strong>: Casting the spell now reveals Zilean if cast from fog of war.</li></ul><p><br><strong>E - Time Warp</strong></p><ul><li><strong>Cast Range</strong>: 550 edge to edge (around 650 in practical use) ⇒ <strong>700 center to center</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Items</h4><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Cloak and Dagger</strong></p><ul><li><strong>Recipe</strong>: Cloak of Agility + Dagger. 1130 total cost.</li><li><strong>Attack Speed</strong>: 20%</li><li><strong>Critical Strike Chance</strong>: 20%</li><li><strong>Unique Passive</strong>: 35% Tenacity, shared with Mercury's Treads, Zephyr, and Moonflair Spellblade.</li></ul><p><br><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Moonflair Spellblade</strong></p><ul><li><strong>Recipe</strong>: Seeker's Armguard + Negatron Cloak. 2300 total cost.</li><li><strong>Ability Power</strong>: 50</li><li><strong>Armor</strong>: 50</li><li><strong>Magic Resistance</strong>: 50</li><li><strong>Unique Passive</strong>: 35% Tenacity, shared with Mercury's Treads, Zephyr, and Cloak and Dagger.</li></ul><p><br><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Zz'Rot Portal</strong></p><ul><li><strong>Recipe</strong>: Chain Vest + Negatron Cloak + Rejuvenation Bead. 2700 total cost.</li><li><strong>Armor</strong>: 50</li><li><strong>Magic Resistance</strong>: 50</li><li><strong>Health Regeneration</strong>: 5 per 5 seconds</li><li><strong>Active</strong>: Place down a void gate for 150 seconds. Voidlings with decaying health periodically spawn and march down the nearest lane, damaging enemies in their path. 150-second cooldown.</li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Systems</h4><p><strong>Council Vote</strong></p><blockquote class=\"blockquote context\"><p>Welcome to our second League Classic community poll! This time around, we want your feedback on six specific areas, including which champion's kit we prioritize restoring next. Head over to \"The Council\" tab in the League client to cast your votes! Voting will be open for seven days and you're free to update your answers while the poll is active. And keep an eye out, as poll results will be published in the next Patch Notes.&nbsp;<br><br>In case you missed it, we previously posted the results of our inaugural Council vote in the Patch 26.18 Notes, and some of those results are starting to go to live, including the three items you voted to revive in this patch!</p></blockquote><p><strong>Miscellaneous</strong></p><ul><li>Added more in-game negative behavior detections.</li><li>Updated in-game pings to use oldschool art.</li><li>Updated start-of-champion select visuals to make team and position more apparent.</li><li>Updated the loading screen to look more classic.</li><li>Improved visual clarity in The Council voting.</li><li>Added a new \"Recommended\" sort in the Runes store, making it easier for new players to identify good early-account runes.</li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Bugfixes</h4><ul><li>Fixed a bug where Janna's Tailwind could persist on allies for up to 5 seconds after death.</li><li>Fixed a bug where the Overview, Abilities, and Skins tabs in Classic champion profiles were misaligned and unclickable.</li><li>Fixed a bug where purchasing Royal Guard Fiora did not grant the associated Classic chroma.</li><li>Fixed a bug where Release Date sorting did not sort Classic Store runes from newest to oldest or oldest to newest.</li><li>Fixed a bug where Recommended was missing from the Classic Store Runes sort options.</li><li>Fixed a bug where Classic homepage images loaded when logging into a non-Classic mode tab.</li><li>Fixed a bug where the Imperial Classic chroma name was missing in Champion Select for Xin Zhao.</li><li>Fixed a bug where Runaan's Hurricane Volley could trigger minions' Call for Help when hitting enemy champions near minions.</li><li>Fixed a bug where Sona's Song of Celerity description incorrectly stated that its effect applied only to champions.</li><li>Fixed a bug where rapidly pressing Recall granted Guinsoo's Rageblade stacks.</li><li>Fixed a bug where Sivir's Spell Shield did not block damage from Miss Fortune's Double Up.</li><li>Fixed a bug where Tristana's Explosive Charge did not trigger its explosion when bonus damage killed a minion.</li><li>Fixed a bug where Release Date ascending and descending sorting had the same effect in Classic Collection portraits.</li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-aram:-mayhem\">ARAM: Mayhem</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><blockquote class=\"blockquote context\"><p>Hello Mayhemers! In this patch, we're focusing on bugfixes and small quality-of-life improvements. We're continuing to assess Augment offerings so that each Augment you're offered feels like a reasonable and meaningful option for your champion. For balance, High Roller has caught our attention for how powerful it can be when picked up early in the game. We're giving it another nerf to bring down some of that early snowballing potential. See you on the Bridge!</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">Augments</h4><p><strong>High Roller</strong></p><ul><li><strong>Drop Rate</strong>: Further reduced.</li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Bugfixes</h4><ul><li>Fixed a bug where Clown College used the wrong text color for true damage.</li><li>Fixed a bug where King Me had debug Augment name shoutouts, including Hellbent, Overloaded, Surge Field, and Spirit Bomb.</li><li>Fixed a bug where Mad Scientist granted both +30% Attack Damage and Ability Power instead of 30% Adaptive Force.</li><li>Fixed a bug where Multishot had extra quest step requirements for Nami's and Ezreal's ultimate abilities.</li><li>Fixed a bug where Yuumi could spam Bilgewater Cannon landing effects when she was attached to a unit.</li><li>Fixed a bug where Bursting Teeth did not trigger due to a per-target cooldown.</li><li>Fixed a bug where Bel'Veth's Q did not reset after using her ultimate when she had Ultimate Awakening.</li><li>Fixed a bug where Item Quest Progress broke when re-adding quest Augment offerings.</li><li>Fixed a bug where Vel'Koz's W did not get the correct refund with Skilled Sniper.</li><li>Fixed a bug where removing Upgrade Ravenous resulted in negative Life Steal for all your items.</li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-arena\">Arena</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><blockquote class=\"blockquote context\"><p>We've got something special for this Arena patch. We've created three Guests of Honor, brought over ten Augments from Mayhem, and we've got two brand-new Augments (Death Dealer and Got That Dog In Em) created in collaboration with the champions, <strong>VestionOCE</strong> and <strong>SoyJamiie</strong>, from the For The Win Creator Invitational we held in Season 2!&nbsp;<br><br>For balance, we're tapping down the power level of some of the strongest and most consistent champions while buffing up some who were struggling. We've also targeted some of the strongest and weakest Augments to bring them closer into line so there's a little bit more freedom of choice.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">Champions</h4><h4 class=\"change-detail-title\">Aphelios</h4><p><strong>Base Stats</strong></p><ul><li><strong>Health Growth</strong>: 102 ⇒ <strong>114</strong></li><li><strong>Attack Damage Growth</strong>: 2.3 ⇒ <strong>3.3</strong></li><li><strong>Move Speed</strong>: 325 ⇒ <strong>330</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Bard</h4><p><strong>Passive - Traveler's Call</strong></p><ul><li><strong>Chimes per Upgrade</strong>: 4 ⇒ <strong>3</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Bel'Veth</h4><p><strong>E - Royal Maelstrom</strong></p><ul><li><strong>On-Hit/Attack Effectiveness</strong>: 12 - 24 ⇒ <strong>8 - 16</strong></li></ul><p><strong>R - Endless Banquet</strong></p><ul><li><strong>Passive Bonus Attack Damage Ratio</strong>: 3 ⇒ <strong>1</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Dr. Mundo</h4><p><strong>E - Blunt Force Trauma</strong></p><ul><li><strong>Active Minimum-Health Ratio</strong>: 5 ⇒ <strong>4</strong></li><li><strong>Passive Health Ratio</strong>: 2 - 3.2 ⇒ <strong>1.5 - 2.7</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Elise</h4><p><strong>E - Cocoon</strong></p><ul><li><strong>Cooldown</strong>: 12 / 11.5 / 11 / 10.5 / 10s ⇒ <strong>8 / 7.5 / 7 / 6.5 / 6s</strong></li></ul><p><strong>W - Skittering Frenzy</strong></p><ul><li><strong>Cooldown</strong>: 12s ⇒ <strong>10s</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Ezreal</h4><p><strong>Q - Mystic Shot</strong></p><ul><li><strong>Refund</strong>: 1.5 ⇒ <strong>2.5</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Lee Sin</h4><p><strong>W - Safeguard</strong></p><ul><li><strong>Ability Power Ratio</strong>: 80% ⇒ <strong>120%</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Lillia</h4><p><strong>Passive - Dream-Laden Bough</strong></p><ul><li><strong>Percentage Maximum Health</strong>: 4% ⇒ <strong>3%</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Locke</h4><p><strong>Passive - Silver Stake</strong></p><ul><li><strong>Minimum Damage</strong>: 7.5 - 60 ⇒ <strong>10 - 80</strong></li><li><strong>Maximum Damage</strong>: 15 - 120 ⇒ <strong>20 - 160</strong></li></ul><p><strong>R - Purgatory</strong></p><ul><li><strong>Percentage per Stack</strong>: 0.5 ⇒ <strong>1</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Neeko</h4><p><strong>Q - Blooming Burst</strong></p><ul><li><strong>Secondary-Hit Ability Power Ratio</strong>: 25% ⇒ <strong>50%</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Ornn</h4><p><strong>Passive - Living Forge</strong></p><ul><li><strong>Stat Discount</strong>: 100 ⇒ <strong>75</strong></li><li><strong>Legendary Discount</strong>: 200 ⇒ <strong>150</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Rammus</h4><p><strong>Q - Powerball</strong></p><ul><li><strong>Cooldown</strong>: 11 / 9.5 / 8 / 6.5 / 5s ⇒ <strong>12 / 10.5 / 9 / 7.5 / 6s</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Rell</h4><p><strong>Passive - Break The Mold</strong></p><ul><li><strong>Stat Steal</strong>: 3 - 15% ⇒ <strong>2 - 10%</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Sion</h4><p><strong>Passive - Glory in Death</strong></p><ul><li><strong>Stacks per Round</strong>: 133 ⇒ <strong>111</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Veigar</h4><p><strong>Passive - Phenomenal Evil Power</strong></p><ul><li><strong>Stacks per Round</strong>: 12 ⇒ <strong>10</strong></li></ul><p><strong>E - Event Horizon</strong></p><ul><li><strong>Cooldown</strong>: 23 / 21.75 / 20.5 / 19.25 / 18s ⇒ <strong>24 / 23 / 22 / 21 / 20s</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Zed</h4><p><strong>Q - Razor Shuriken</strong></p><ul><li><strong>Bonus Attack Damage Ratio</strong>: 110% ⇒ <strong>100%</strong></li></ul><p><strong>W - Living Shadow</strong></p><ul><li><strong>Cooldown</strong>: 18 - 15s ⇒ <strong>20 - 16s</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Zeri</h4><p><strong>Q - Burst Fire</strong></p><ul><li><strong>Attack Damage Ratio</strong>: 102 - 110% ⇒ <strong>107 - 115%</strong></li></ul><p><strong>E - Spark Surge</strong></p><ul><li><strong>Refund</strong>: 0.75 ⇒ <strong>1</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Augments</h4><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Archmage</strong></p><ul><li>Whenever you cast an ability, refund the cooldown of another, randomly selected ability by 30% of the cast ability's cooldown.</li></ul><hr class=\"divider\"><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Crit N Cast</strong></p><ul><li>Gain Ability Haste equal to 40% of your Critical Strike Chance.</li></ul><hr class=\"divider\"><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Death Dealer</strong></p><ul><li><strong>Replacement</strong>: Replaces Flee.</li><li>Activate on a target champion to enter the Death Realm for 4 / 8 seconds. Entering the Death Realm causes you to become invisible for the first 2 seconds.</li><li><strong>Cap Stone</strong>: At Max Level, killing your target grants your team another revive and delays the slain player's revive by 1 second.</li></ul><hr class=\"divider\"><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Got That Dog In Em</strong></p><ul><li>Every 3 seconds spawn a nearby hot dog. This can be picked up by anyone, causing them to breathe fire.</li><li>Enemies who pick this up can damage their allies.</li><li>If you die while breathing fire, you explode, dealing magic damage per stack.</li></ul><hr class=\"divider\"><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Hellbent</strong></p><blockquote class=\"blockquote context\"><p>Generate a stack of Revivemaxxing for each enemy champion you hit with basic attacks or abilities, lasting for 6 seconds, refreshing on subsequent hits, and stacking up to 10 times. At maximum stacks, you become Hellbent.</p></blockquote><ul><li><strong>Hellbent</strong>: Upon taking lethal damage, you enter resurrection for 4 seconds, during which you are invulnerable, untargetable, and unable to act. Afterwards, you revive with 35 - 75% (based on level) of your maximum health with a 90-second cooldown. Additionally, you become empowered for the next 15 seconds, granting you 15 - 120 (based on level) bonus Attack Damage or 25 - 200 (based on level) Ability Power (Adaptive), 20% - 40% (based on level) bonus Move Speed while facing toward nearby enemy champions, and 15% - 30% (based on level) Omnivamp for the duration.</li></ul><hr class=\"divider\"><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Nature Is Healing</strong></p><blockquote class=\"blockquote context\"><p>Upon entering a patch of brush, you are healed for 40 - 300 (based on level) (+15% of your missing health) over 1.5 seconds. This has a 10-second cooldown per brush patch.</p></blockquote><hr class=\"divider\"><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Rite of Ascension</strong></p><blockquote class=\"blockquote context\"><p>Scoring a takedown against an enemy champion within 3 seconds of damaging them causes them to leave behind their Essence for 8 seconds. You can basic attack the Essence within 400 units to consume it, causing you to blink to its location after winding up for 1.25 seconds, during which you are untargetable, displacement immune, and unable to act.</p></blockquote><ul><li>Upon consumption of the Essence, you gain 100% bonus Move Speed decaying over 2 seconds, heal yourself for 75 - 300 (based on level) (+50% bonus AD) (+25% AP), and reset the cooldowns of your basic abilities. The heal is increased by 0% - 100% (based on your missing health), for a maximum heal of 150 - 600 (based on level) (+100% bonus AD) (+50% AP).</li></ul><hr class=\"divider\"><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Shark Bait</strong></p><blockquote class=\"blockquote context\"><p>Upon taking fatal damage, you become a Shark Bait, causing you to enter a zombie state for 3.5 seconds, during which your Move Speed is set to a static 400, you gain Ghosting, and enemies within 400 units of you are slowed by 40%.</p></blockquote><ul><li>At the end of the duration, a massive shark emerges from beneath you that lets out a powerful chomp in a 400 radius, dealing 120 - 350 (based on level) (+10 / 30% of the target's missing health) magic damage to all enemies within the area and knocking them up for 1 second.</li><li>While under the zombie state, you are able to move and become invulnerable, untargetable, and immune to crowd control, but you are also rendered unable to declare basic attacks, cast abilities, use summoner spells, and activate items.</li><li>At Max Level, everyone on your team will turn into a shark on death.</li></ul><hr class=\"divider\"><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Sonata</strong></p><blockquote class=\"blockquote context\"><p>Alternate between automatically casting a modified version of Sona's Aria of Perseverance and modified Song of Celerity, with the former being cast first on a 7.5-second cooldown.</p></blockquote><ul><li><strong>Aria of Perseverance</strong>: Heal yourself for 60 (+60% AP) and send out a tone to the most wounded allied champion within 1000 units that heals them for the same amount. Additionally, generate an aura that grants you and tagged allied champions an 80 (+40% AP) shield for 1.5 seconds.</li><li><strong>Song of Celerity</strong>: Gain 30% bonus Move Speed for 7 seconds. If you take damage during this time, the duration ends prematurely once or if 3 seconds have elapsed. Additionally, generate an aura that grants tagged allied champions 20% bonus Move Speed for 3 seconds.</li></ul><hr class=\"divider\"><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Surge Field</strong></p><blockquote class=\"blockquote context\"><p>Upon casting your ultimate ability, you spawn a surge zone beneath you that has a 300 radius. While you are within the zone, you gain 50 Ability Haste and 40% bonus Move Speed, and your damage dealt to enemy champions fires missiles at them that deal 20% of the triggering damage instance pre-mitigation as bonus magic damage.</p></blockquote><ul><li>The missile effect cannot trigger from itself.</li><li>The zone lasts indefinitely as long as you stay within its radius.</li><li>If you leave the zone's radius for the first time, it moves to your current location.</li><li>Exiting the zone a second time causes it to disappear if you do not re-enter the area within 1.25 seconds.</li></ul><hr class=\"divider\"><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Titan's Resolve</strong></p><blockquote class=\"blockquote context\"><p>Dealing and receiving champion damage grants you 1 stack of Juggernauting for 6 seconds. For every 10 stacks of Juggernauting you gain 25-75 Adaptive Force, 5-10 Armor and Magic Resist, Size, and 8% Tenacity.</p></blockquote><ul><li><strong>Rank 1 Stacks Gained</strong>: 1</li><li><strong>Rank 2 Stacks Gained</strong>: 2</li></ul><hr class=\"divider\"><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Warlock Juicebox</strong></p><blockquote class=\"blockquote context\"><p>Gain Omnivamp based on your Ability Power.</p></blockquote><hr class=\"divider\"><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Wee Woo Wee Woo</strong></p><blockquote class=\"blockquote context\"><p>Gain up to 50% Move Speed toward nearby allies based on their missing Health. Your healing and shielding are also increased up to 50% based on the target's missing Health.</p></blockquote><hr class=\"divider\"><p><strong>Angel of Retribution</strong></p><ul><li><strong>Health Scaling Ratio</strong>: 350 ⇒ <strong>450</strong></li></ul><hr class=\"divider\"><p><strong>Chroma Flux</strong></p><ul><li><strong>Rarity</strong>: Prismatic ⇒ <strong>Gold</strong></li></ul><hr class=\"divider\"><p><strong>Giant Slayer</strong></p><ul><li><strong>Rank 1 Damage Bonus</strong>: 10 - 30 ⇒ <strong>5 - 25</strong></li><li><strong>Rank 2 Damage Bonus</strong>: 15 - 35 ⇒ <strong>10 - 30</strong></li><li><strong>Rank 3 Damage Bonus</strong>: 20 - 40 ⇒ <strong>15 - 35</strong></li></ul><hr class=\"divider\"><p><strong>Protein Shake</strong></p><ul><li><strong>Base Health Scaling</strong>: 15 ⇒ <strong>25</strong></li></ul><hr class=\"divider\"><p><strong>Scavenger</strong></p><ul><li><strong>Gold</strong>: 500 ⇒ <strong>1000</strong></li></ul><hr class=\"divider\"><p><strong>Spellcraft</strong></p><ul><li><strong>Cooldown</strong>: 15 seconds ⇒ <strong>10 seconds</strong></li><li><strong>Base Damage</strong>: 100 ⇒ <strong>150</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Systems</h4><p><strong>Bonus Energy Regen Based on Missing Health</strong></p><ul><li><strong>Maximum Bonus Energy Regeneration</strong>: Up to 100% ⇒ <strong>Up to 400%</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Guests of Honor</h4><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Ivern</strong></p><ul><li>When a team loses a round, spawn a brush at each of their locations. This brush lasts the rest of the game.</li></ul><p><br><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Senna</strong></p><ul><li>Opens up 3 portals to the Death Realm. Anyone can enter the portal to go to the Death Realm. While in the Death Realm, you can go through any of the portals to return to the living realm.</li></ul><p><br><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Thresh</strong></p><ul><li>While downed, throw a lantern to your allies every few (8) seconds. This grants allies near the lantern a shield. Anyone can click the lantern to be pulled to the downed player.</li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-bugfixes-and-qol-changes\">Bugfixes &amp; QoL Changes</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><ul><li>Fixed a bug where Renata's R would not amp damage caused by Berserk targets.</li><li>Updated the Practice Tool Stack Item cheat to include: Dark Seal, Mejai's, Heartsteel, Gluttonous Greaves, and Force of Nature.</li><li>Fixed a bug where Taliyah's W terrain was smaller than the hitbox.</li><li>Fixed a bug where Yone's R warning VFX was not visible in very specific circumstances.</li><li>Fixed a bug where Yunara's auto resets would not extend Hail of Blades appropriately.</li><li>Fixed a bug where Renekton would not gain 20 fury from his ult when it was cast immediately after W.</li><li>Fixed a bug where Nunu &amp; Willump could unlock his camera during W.</li><li>Fixed a bug where clones would not receive Homeguards after running back to the fountain</li><li>Fixed a bug where Target Champions Only could be toggled on unexpectedly</li><li>Fixed a bug where Camille's W would count as two hits when triggering bone plating.</li><li>Fixed a bug where Camille's Passive would sometimes not proc Shield Bash.</li><li>Fixed a bug where Aatrox Q sweetspots use crit text instead of enhanced damage text.</li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-upcoming-skins-and-chromas\">Upcoming Skins &amp; Chromas</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><p>The following skins will be released in this patch:</p><div class=\"gs-container default-2-col\"><div class=\"skin-box\"><p><a class=\"skins cboxElement\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/42ec56c9308464c0c64034d6bcf691fdb14ad377-1920x1149.jpg\"><span class=\"content-border\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/42ec56c9308464c0c64034d6bcf691fdb14ad377-1920x1149.jpg\"></span></a></p><h4 class=\"skin-title\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/42ec56c9308464c0c64034d6bcf691fdb14ad377-1920x1149.jpg\">Coven Janna</a></h4></div><div class=\"skin-box\"><p><a class=\"skins cboxElement\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/8c8f9e5e815d1f0b2178e317e38bee7ec1bae6f0-1920x1080.jpg\"><span class=\"content-border\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/8c8f9e5e815d1f0b2178e317e38bee7ec1bae6f0-1920x1080.jpg\"></span></a></p><h4 class=\"skin-title\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/8c8f9e5e815d1f0b2178e317e38bee7ec1bae6f0-1920x1080.jpg\">Coven Mel</a></h4></div></div><div class=\"gs-container default-2-col\"><div class=\"skin-box\"><p><a class=\"skins cboxElement\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://cmsassets.rgpub.io/sanity/images/dsfx
