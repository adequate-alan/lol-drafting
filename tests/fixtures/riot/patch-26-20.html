<!DOCTYPE html><html><body><script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"page": {"title": "League of Legends Patch 26.20 Notes", "url": "https://www.leagueoflegends.com/en-us/news/game-updates/league-of-legends-patch-26-20-notes/", "displayedPublishDate": "2026-10-06T18:00:00.000Z", "analytics": {"contentId": "d1feeede-bde0-47e4-bb9c-b06921b070d6.en-us", "contentLocale": "en-us", "rev": "0wTGOHdF3u4bmKC2Z9kPkR", "publishDate": "2026-10-06T18:00:00.000Z"}, "blades": [{"fragmentId": "26.20", "palette": "palette2", "richText": {"type": "html", "body": "<div id=\"patch-notes-container\"><h2 id=\"patch-top\">&nbsp;</h2><blockquote class=\"blockquote context\"><p>Bee wee woop - it's time for WORLDS! For Summoner's Rift, this is the patch we'll be seeing our year-defining competitive play on. Lock in, because we've got some adjustments to some pro staples like Ambessa &amp; K'Sante, and buffs to weaker champions who might be on the edge of viability like Kennen &amp; Kindred. Rocketbelt is getting another tap to make it a bit worse at just being a purchasable Flash for immobile characters, with some immediate compensation for some core users because this is the patch and it's the only shot we've got. There's quite a bit more, including fun stuff for Mayhem &amp; Classic, so read on for details!<br><br>Looking for more information on all things League of Legends? Check out our community-run wiki <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://wiki.leagueoflegends.com/en-us/\"><i>here</i></a><i>!</i><br><br>Wrong patch notes? You can find the <i>TFT patch notes </i><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://teamfighttactics.leagueoflegends.com/en-us/news/game-updates/teamfight-tactics-patch-18-4\"><i>here</i></a><i>!</i></p></blockquote><div class=\"context-designers\"><span class=\"context-designer\" style=\"text-align:left;\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/d7e6f8e9d6bd9dfb639083e670d4ab31bfb7dc03-143x148.png\"> Austin \"Riot wroadie\" Wright</span></div><div class=\"context-designers\"><span class=\"context-designer\" style=\"text-align:left;\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b36c216eac2e27319ed6c7a5df2dd25e449adee2-220x220.jpg\"> Erika \"Riot Cashmiir\" Haas</span></div><div class=\"context-designers\"><span class=\"context-designer\" style=\"text-align:left;\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/ca1ff9c14a7c22252e92199aec42db4e03d24806-300x300.jpg\"> Steven \"Riot sternest\" Earnest</span></div><header class=\"header-primary\"><h2 id=\"patch-patch-highlights\">Patch Highlights</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><p><a class=\"skins cboxElement\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/5fc73f2f8167c4d67ecea021cfa10a825ecacbd4-1920x1080.png\"><span class=\"content-border\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/5fc73f2f8167c4d67ecea021cfa10a825ecacbd4-1920x1080.png\"></span></a></p><p>Prestige Classic Baron Kog'Maw, Prestige HEARTSTEEL Live My Life Sett, HEARTSTEEL Live My Life Ezreal, HEARTSTEEL Live My Life Kayn, HEARTSTEEL Live My Life Aphelios, HEARTSTEEL Live My Life Yone, and HEARTSTEEL Live My Life K'Sante will be available October 7, 2026.</p></div></div></div><header class=\"header-primary\"><h2 id=\"patch-private-replays\">Private Replays</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><blockquote class=\"blockquote context\"><p>Starting with this patch, you will only be able to access replays from matches you played in. Other players will no longer be able to download your replays, and third-party apps &amp; sites will lose access to replay downloads entirely.<br><br>We are making this change, alongside some restrictions on third party access to game memory, to close some security vulnerabilities that have recently been exploited by cheat developers and other bad actors to build unauthorized tools around League game data. You can read more about the full context in our <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://support.riotgames.com/en-us/riot/performance/game-memory-access-removed-for-third-party-apps\">Game Memory Removed for Third Party Apps Player Support article.</a><br><br>Rest assured that this change will not impact your ability to VOD review your own matches by downloading and watching your replays directly in the League client!</p></blockquote></div></div></div><header class=\"header-primary\"><h2 id=\"patch-champions\">Champions</h2></header><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/ambessa/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Ambessa.png\"></a></p><h3 class=\"change-title\" id=\"patch-ambessa\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/ambessa/\">Ambessa</a></h3><blockquote class=\"blockquote context\"><p>Ambessa has been too reliable in her late game output for players with high mastery in all brackets, but especially pro-play.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/passive/Icon_Ambessa_Passive.png\">Passive - Drakehound's Step</h4><ul><li><strong>Damage</strong>: 5 - 30 (+25% bonus AD) ⇒ <strong>5 - 25 (+20% bonus AD)</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/ashe/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Ashe.png\"></a></p><h3 class=\"change-title\" id=\"patch-ashe\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/ashe/\">Ashe</a></h3><blockquote class=\"blockquote context\"><p>Ashe is one of the premier marksmen in pro play at the moment, and we're seeing her output too much raw damage given her position as the highest utility marksman in the game.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">Base Stats</h4><ul><li><strong>Attack Damage per Level</strong>: 3.5 ⇒ <strong>3</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/cassiopeia/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Cassiopeia.png\"></a></p><h3 class=\"change-title\" id=\"patch-cassiopeia\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/cassiopeia/\">Cassiopeia</a></h3><blockquote class=\"blockquote context\"><p>Our changes two patches ago to Cassiopeia have been pretty good directionally, with most players being proportionally less impacted from those adjustments than pros. We're taking another swing at her early resources because of how dominant she still is in early laning, making her work a little harder to create an advantage.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">Base Stats</h4><ul><li><strong>Base Health</strong>: 630 ⇒ <strong>610</strong></li><li><strong>Base Mana</strong>: 480 ⇒ <strong>450</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/diana/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Diana.png\"></a></p><h3 class=\"change-title\" id=\"patch-diana\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/diana/\">Diana</a></h3><blockquote class=\"blockquote context\"><p>While Diana's assassin build shines, her bruiser builds tend to be lagging a good bit behind. We want to inject a bit more power into that playstyle.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/DianaOrbs.png\">W - Pale Cascade</h4><ul><li><strong>Shield Bonus Health Ratio</strong>: 11% ⇒ <strong>14%</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/kennen/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Kennen.png\"></a></p><h3 class=\"change-title\" id=\"patch-kennen\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/kennen/\">Kennen</a></h3><blockquote class=\"blockquote context\"><p>Stacking the odds a bit more in his favor with his signature spell (in Riftbound) and offsetting Rocketbelt changes that he'll be a bit less excited about.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/KennenLightningRush.png\">E - Lightning Rush</h4><ul><li><strong>Bonus Attack Speed</strong>: 40 / 50 / 60 / 70 / 80% ⇒ <strong>50 / 60 / 70 / 80 / 90%</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/kindred/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Kindred.png\"></a></p><h3 class=\"change-title\" id=\"patch-kindred\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/kindred/\">Kindred</a></h3><blockquote class=\"blockquote context\"><p>Kindred is currently a bit weak, so we're giving them buffs in areas that won't make them much more overwhelming in early invades. Optimistically, they'd also make a pretty unique addition to the meta.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/KindredW.png\">W - Wolf's Frenzy</h4><ul><li><strong>Monster Mod</strong>: 150% ⇒ <strong>165%</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/KindredEWrapper.png\">E - Mounting Dread</h4><ul><li><strong>Slow Duration</strong>: 1s ⇒ <strong>1.5s</strong></li><li><strong>Small Monster Targeting</strong>: Enabled ⇒ <strong>Removed</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/ksante/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/KSante.png\"></a></p><h3 class=\"change-title\" id=\"patch-ksante\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/ksante/\">K'Sante</a></h3><blockquote class=\"blockquote context\"><p>Warding off this warden from being as reliable as a blind pick in coordinated play - hurting early mana and consistent W damage reduction, which should be skewed for elite audiences.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/KSanteW.png\">W - Path Maker</h4><ul><li><strong>Mana Cost</strong>: 40 / 45 / 50 / 55 / 60 ⇒ <strong>45 / 50 / 55 / 60 / 65</strong></li><li><strong>W Base/All-Out Damage Reduction</strong>: 30 / 75% ⇒ <strong>25 / 70%</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/lillia/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Lillia.png\"></a></p><h3 class=\"change-title\" id=\"patch-lillia\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/lillia/\">Lillia</a></h3><blockquote class=\"blockquote context\"><p>Last patch we looked to inject a bit more power into the deer, but didn't quite see the movement we were looking for. We believe there is a bit more room for her to really prance around various levels of play so we are following up with another buff that'll really help her shine.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/LilliaR.png\">R - Lilting Lullaby</h4><ul><li><strong>Duration</strong>: 2.5s ⇒ <strong>2.5 / 2.75 / 3s</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/lucian/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Lucian.png\"></a></p><h3 class=\"change-title\" id=\"patch-lucian\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/lucian/\">Lucian</a></h3><blockquote class=\"blockquote context\"><p>Last patch's adjustment to help normalize mid and bot performance ended up landing as a nerf for bot lane, so we're following up with a buff to make up for the lost power.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">Base Stats</h4><ul><li><strong>Attack Damage</strong>: 60 + 2.5/Level ⇒ <strong>60 + 2.9/Level</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/mordekaiser/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Mordekaiser.png\"></a></p><h3 class=\"change-title\" id=\"patch-mordekaiser\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/mordekaiser/\">Mordekaiser</a></h3><blockquote class=\"blockquote context\"><p>Windows between Mordekaiser's ultimates make it hard to keep up with the pace of much of his opposition. His bread and butter (Q) can also feel less impactful as the pace of the game increases, so we think it can do more damage later on.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/MordekaiserQ.png\">Q - Obliterate</h4><ul><li><strong>Scaling Level 10-20</strong>: (+5/lvl) ⇒ <strong>(+7/lvl)</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/MordekaiserR.png\">R - Realm of Death</h4><ul><li><strong>Cooldown</strong>: 140 / 120 / 100s ⇒ <strong>120 / 110 / 100s</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/neeko/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Neeko.png\"></a></p><h3 class=\"change-title\" id=\"patch-neeko\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/neeko/\">Neeko</a></h3><blockquote class=\"blockquote context\"><p>Rocketbelt's adjustment this patch will probably land as a small nerf for Neeko, so we're giving her some minor compensation</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/NeekoE.png\">E - Tangle-Barbs</h4><ul><li><strong>Base Damage</strong>: 70 / 105 / 140 / 175 / 210 (+65% AP) ⇒ <strong>80 / 115 / 150 / 185 / 220 (+65% AP)</strong></li><li><strong>Empowered Root Duration</strong>: 1.8 / 2.1 / 2.4 / 2.7 / 3s ⇒ <strong>2 / 2.25 / 2.5 / 2.75 / 3s</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/smolder/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Smolder.png\"></a></p><h3 class=\"change-title\" id=\"patch-smolder\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/smolder/\">Smolder</a></h3><blockquote class=\"blockquote context\"><p>Smolder has lost quite a bit of power over the last few patches, with the Cleaver ranged nerf and bot lane meta changes disfavoring him significantly. We're further encouraging crit builds to bring his bruiser and full crit builds closer in power.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/passive/Icons_Smolder_Passive.png\">Passive - Dragon Practice</h4><ul><li><strong>Super Scorcher Bonus Magic Damage</strong>: 25 - 55% (+0-9% with IE) of Dragon Practice Stacks, scaling with Crit Chance ⇒ <strong>25 - 60% (+0-10.5% with IE) of Dragon Practice Stacks, scaling with Crit Chance</strong></li><li><strong>Flap Flap Flap Bonus Magic Damage</strong>: 8 - 12.8% (+0-1.44% with IE) of Dragon Practice Stacks, scaling with Crit Chance ⇒ <strong>8 - 14% (+0-1.8% with IE) of Dragon Practice Stacks, scaling with Crit Chance</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/SmolderR.png\">R - Mmooommmm!</h4><ul><li><strong>Self Heal</strong>: 100 / 135 / 170 (+50% bonus AD) (+75% AP) ⇒ <strong>100 / 175 / 250 (+75% bonus AD) (+75% AP)</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/swain/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Swain.png\"></a></p><h3 class=\"change-title\" id=\"patch-swain\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/swain/\">Swain</a></h3><blockquote class=\"blockquote context\"><p>We're giving Swain mid a moderate buff this patch while also making an adjustment that should help normalize his mid and bot lane performance.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">Base Stats</h4><ul><li><strong>Base Magic Resistance</strong>: 31 ⇒ <strong>34</strong></li><li><strong>Base Armor</strong>: 25 ⇒ <strong>23</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/SwainW.png\">W - Vision of Empire</h4><ul><li><strong>Damage</strong>: 70 / 105 / 140 / 175 / 210 (+60%) ⇒ <strong>70 / 115 / 160 / 205 / 250 (+60%)</strong></li><li><strong>Cooldown</strong>: 22 / 21 / 20 / 19 / 18s ⇒ <strong>20 / 19 / 18 / 17 / 16s</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/tahmkench/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/TahmKench.png\"></a></p><h3 class=\"change-title\" id=\"patch-tahmkench\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/tahmkench/\">Tahm Kench</a></h3><blockquote class=\"blockquote context\"><p>As one of the tank supports with the lowest health regen, and many health scaling values on his abilities, Tahm Kench lost out on the recent adjustments to the support item. We're giving him compensation for that.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/TahmKenchQ.png\">Q - Tongue Lash</h4><ul><li><strong>Base Healing</strong>: 10 / 13.75 / 17.5 / 21.25 / 25 ⇒ <strong>10 / 20 / 30 / 40 / 50</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/vayne/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Vayne.png\"></a></p><h3 class=\"change-title\" id=\"patch-vayne\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/vayne/\">Vayne</a></h3><blockquote class=\"blockquote context\"><p>Vayne has settled into a fairly weak spot, and while we still aren't totally happy with her top vs bot skew, we're getting closer. We're adjusting her base stats to help in bot where she needs to weather harass, and reverting a mana cost to her Q that simply felt way too bad.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">Base Stats</h4><ul><li><strong>Health per 5</strong>: 4 + .5/Level ⇒ <strong>5.5 +.4/Level</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/VayneTumble.png\">Q - Tumble</h4><ul><li><strong>Mana Cost</strong>: 46 / 42 / 38 / 34 / 30 ⇒ <strong>30</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/yunara/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/Yunara.png\"></a></p><h3 class=\"change-title\" id=\"patch-vayne\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/yunara/\">Yunara</a></h3><blockquote class=\"blockquote context\"><p>Yunara is the leading candidate for \"handshake hyperscaler do nothing\" and we want to avoid that becoming the dominant meta, especially heading into worlds.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/YunaraQ.png\">Q - Cultivation of Spirit</h4><ul><li><strong>Passive On Hit Damage</strong>: 5 / 10 / 15 / 20 / 25 (+20% AP) ⇒ <strong>3 / 8 / 13 / 18 / 23 (+20% AP)</strong></li><li><strong>Active On Hit Damage</strong>: 5 / 10 / 15 / 20 / 25 (+20% AP) ⇒ <strong>3 / 8 / 13 / 18 / 23 (+20% AP)</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/YunaraW.png\">W - Arc of Judgement</h4><ul><li><strong>Slow Stacking</strong>: Stacks with other slows ⇒ <strong>No longer stacks with other slows</strong></li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-items\">Items</h2></header><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/item/3073.png\"></a></p><h3 class=\"change-title\" id=\"patch-Experimental-Hexplate\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\">Experimental Hexplate</a></h3><blockquote class=\"blockquote context\"><p>We've been fairly unhappy with how this item has played out for ranged users, especially as a first rush in top lane where it makes them too resilient to burst and too lethal during all ins.</p></blockquote><ul><li><strong>Ranged Mod</strong>: 70% of Value (35% Attack Speed, 14% Move Speed) ⇒ <strong>50% of Value (25% Attack Speed, 10% Move Speed)</strong></li></ul><hr class=\"divider\"><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/item/223152.png\"></a></p><h3 class=\"change-title\" id=\"patch-Hextech-Rocketbelt\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\">Hextech Rocketbelt</a></h3><blockquote class=\"blockquote context\"><p>Rocketbelt continues to be used a bit too much as an escape compared to a risky engage tool, so we are pulling back on its generic value in favor of emphasizing aggressive action with it, especially for AP Bruisers who rely on it for all ins.</p></blockquote><ul><li><strong>Ability Haste</strong>: 20 ⇒ <strong>10</strong></li><li><strong>Active Damage</strong>: 100 (+10% AP) ⇒ <strong>135 (+15% AP)</strong></li></ul><hr class=\"divider\"><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/item/223085.png\"></a></p><h3 class=\"change-title\" id=\"patch-Runaans-Hurricane\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\">Runaan's Hurricane</a></h3><blockquote class=\"blockquote context\"><p>This item was slightly overbuffed, so pulling back on that a bit.</p></blockquote><ul><li><strong>Attack Damage per Bolt</strong>: 65% ⇒ <strong>60%</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Scoreboard Cleanup</h4><blockquote class=\"blockquote context\"><p>Our recent systemic buff-bar clarity work moved a lot of numbers from buffs onto items. These numbers began terrorizing your scoreboards (thanks, Death's Dance). The scoreboard should show strategically relevant information, not noisy in-the-moment combat state, and we're hiding most item numbers on the scoreboard to reflect this principle. Strategically relevant item numbers, like Tear of the Goddess items and Mejai's Soulstealer, remain on the scoreboard icons.</p></blockquote><p>The following items' icon counters are now hidden on the scoreboard:</p><ul><li>Death's Dance</li><li>Haunting Guise</li><li>Liandry's Torment</li><li>Riftmaker</li><li>Kraken Slayer</li><li>Terminus</li><li>Guinsoo's Rageblade</li><li>Fiendhunter Bolts</li><li>Echoes of Helia</li><li>Dead Man's Plate</li><li>Spear of Shojin</li><li>Overlord's Bloodmail</li><li>Hullbreaker</li><li>Jak'sho the Protean</li><li>Force of Nature</li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-classic\">Classic</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><blockquote class=\"blockquote context\"><p>Are you ready for MORE new old champions?! Because we are! This time around we've got an eclectic crew who have no business forming a band together. Everyone please welcome Aatrox, Caitlyn, Irelia, Karma, and Quinn to the Fields of Justice.<br><br>As a note, the Act II Battle Pass will be arriving with Patch 26.21</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">Champions</h4><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Aatrox</strong></p><blockquote class=\"blockquote context\"><p>Aatrox was just a baby, 3 patches old, when we chose to snapshot him for League Classic. He only ever had four balance changes before his rework in 2017 and subsequent rework in 2018, and we're excited to see how he'll perform again. He's an attack-focused fighter, damaging himself to gain attack speed and revive when he would be killed</p></blockquote><ul><li><strong>Passive - Blood Well</strong>: Aatrox's basic abilities damage himself to fill his Blood Well, which gives him bonus attack speed. If he's killed, he empties his Blood Well to revive on the spot.</li><li><strong>Q - Dark Flight</strong>: Aatrox flies up and crashes down, damaging and knocking up enemies in the area.</li><li><strong>W - Blood Thirst / Blood Price</strong>: Toggle between Blood Thirst and Blood Price, each of which have bonus effects every three attacks. Blood Thirst heals Aatrox, increased when he's low on health. Blood Price deals bonus damage and self-damages.</li><li><strong>E - Blades of Torment</strong>: Aatrox fires out two projectiles that damage and slow all enemies they touch.</li><li><strong>R - Massacre</strong>: Aatrox damages all nearby enemy champions and gains bonus attack speed and attack range for several seconds.</li></ul><hr class=\"divider\"><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Caitlyn</strong></p><blockquote class=\"blockquote context\"><p>Classic's version of Caitlyn was live from 2011-2015. Did you know when she first came out, some players were upset that she was too similar to Miss Fortune?</p></blockquote><ul><li><strong>Passive - Headshot</strong>: Every few attacks, Caitlyn fires a headshot, dealing bonus damage. Headshot charges up faster while attacking from brush.</li><li><strong>Q - Piltover Peacemaker</strong>: Catilyn fires a piercing shot that deals less damage to each subsequent target.</li><li><strong>W - Yordle Snap Trap</strong>: Caitlyn puts a trap on the ground that roots and damages the first enemy champion to walk over it. She can have up to 2 traps down at a time.</li><li><strong>E - 90 Caliber Net</strong>: Caitlyn fires out a massive net, knocking herself back in the process. The net damages and slows the first enemy it hits.</li><li><strong>R - Ace in the Hole</strong>: Caitlyn channels then fires a single bullet at an enemy champion, which deals tons of damage, but can be intercepted by other enemy champions.</li></ul><hr class=\"divider\"><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Irelia</strong></p><blockquote class=\"blockquote context\"><p>Welcome back the 2010-2018 version of Irelia! The original Trinity Force poster child is here to even the odds no matter how bad they look. She's been Q-max, W-max, and E-max at various points in time, so see what build order works for you! She's a fast but deceptively durable fighter who loves to be the underdog.</p></blockquote><ul><li><strong>Passive - Ionian Fervor</strong>: Irelia gains bonus Tenacity based on how many visible enemy champions are nearby.</li><li><strong>Q - Bladesurge</strong>: Irelia dashes to an enemy, dealing damage and applying on-hit effects. If it kills the target, Bladesurge's full cooldown and some of its mana cost are refunded.</li><li><strong>W - Hiten Style</strong>: Passively, Irelia restores some health with every attack. While active, her attacks deal bonus true damage and restore even more health.</li><li><strong>E - Equilibrium Strike</strong>: Irelia damages and slows a nearby enemy. If they have higher %HP than her, she stuns them instead..</li><li><strong>R - Transcendent Blades</strong>: Irelia sequentially fires out four blades in a line, each damaging all enemies they hit and restoring some health to Irelia. This is definitely not just a wave clear tool.</li></ul><hr class=\"divider\"><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Karma</strong></p><blockquote class=\"blockquote context\"><p>Karma came out just two patches after Caitlyn and was only live for just over two years before being reworked in early 2013. Karma is arguably League's first battlemage, rewarding her for getting in the thick of it and making her stronger the more health she's missing.</p></blockquote><ul><li><strong>Passive - Inner Flame</strong>: Karma gains bonus AP based on her missing health.</li><li><strong>Q - Heavenly Wave</strong>: Karma fires out blades in a fan, err, cone in front of her, damaging all enemies it hits. If empowered with Mantra, it also heals all allies (herself included), scaling with their missing health.</li><li><strong>W - Spirit Bond</strong>: Karma bonds with another target, giving allies (herself included) move speed, slowing enemies, and creating a tether between the two. Any champion caught in the clothesline is hasted or slowed as if they were the initial target. Enemies who get caught in the clothesline are damaged. If empowered with Mantra, all move speed effects are doubled.</li><li><strong>E - Soul Shield</strong>: Karma shields a target. If empowered with Mantra, it also damages all enemies around her target.</li><li><strong>R - Mantra</strong>: Mantra is available at level 1 and can hold up to two charges. She can cast it to empower her next basic ability.</li></ul><hr class=\"divider\"><p><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Quinn and Valor</strong></p><blockquote class=\"blockquote context\"><p>Quinn and Valor have returned, having only existed in this form for just over two years, from 2013-2015. Quinn is a ranged and evasive auto-attacker, while her ultimate calls in Valor to fight as a blistering-fast melee skirmisher instead.</p></blockquote><ul><li><strong>Passive - Harrier</strong>: Valor periodically marks nearby enemies, whom Quinn can attack to deal bonus damage.</li><li><strong>Q - Blinding Assault</strong>: Valor flies out to damage and blind enemies in an area.</li><li><strong>W - Heightened Senses</strong>: Passively gives Quinn bonus attack and move speed whenever she triggers Harrier. Activate to briefly reveal a large area around her.</li><li><strong>E - Vault</strong>: Quinn dashes to and then vaults off an enemy, damaging, knocking back, and slowing them. Valor then marks the target with Harrier.</li><li><strong>R - Tag Team</strong>: Quinn retreats from the battlefield, sending Valor in her place. Valor has substantial bonus move speed, permanently has an empowered version of Heightened Senses' attack speed buff, and casts modified versions of Blinding Assault and Vault. Re-casting (R) casts Skystrike, damaging all nearby enemies and returning Quinn to the battlefield.</li></ul><hr class=\"divider\"><p><strong>Fiora</strong></p><blockquote class=\"blockquote context\"><p>Fiora is still the game's most dominant top laner even after her last set of nerfs, so we're back for one more round. We don't want to take down her explosive ultimate any further, so we're just going for a generic damage nerf.</p></blockquote><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/FioraW.png\">W - Riposte</h4><ul><li><strong>Bonus Attack Damage</strong>: 15 / 20 / 25 / 30 / 35 ⇒ <strong>10 / 15 / 20 / 25 / 30</strong></li></ul><hr class=\"divider\"><p><strong>Graves</strong></p><blockquote class=\"blockquote context\"><p>Graves came out swinging, being both wildly popular and arguably the game's strongest champion. We've got some feel-good changes to his animations, especially his critical strike one, and some less-feel-good nerfs as he desperately needs them. We're looking to preserve his bursty shotgunning and unique aspects as a tanky ADC, so that means we simply have to reduce his sustained damage.</p></blockquote><h4 class=\"change-detail-title\">Base Stats</h4><ul><li><strong>Basic Attack and Critical Attack Animations</strong>: Sped up</li><li><strong>Base Attack Damage</strong>: 54.1 ⇒ <strong>50</strong></li><li><strong>Attack Damage per Level</strong>: 3.1 ⇒ <strong>2.5</strong></li><li><strong>Attack Speed per Level</strong>: 2.9% ⇒ <strong>2.5%</strong></li></ul><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/GravesChargeShot.png\">R - Collateral Damage</h4><ul><li><strong>Cone Damage</strong>: 140 / 250 / 360 + 120% bonus AD ⇒ <strong>140 / 230 / 320 + 100% bonus AD</strong></li><li><strong>Projectile Damage</strong>: Unchanged</li></ul><hr class=\"divider\"><p><strong>Fizz</strong></p><blockquote class=\"blockquote context\"><p>Fizz came out right behind Graves as a super strong performer, but mostly as an AP assassin in mid lane. We want to preserve both his assassin and fighter playstyles, so we're skewing our nerfs toward his higher-AP builds. We're pulling in lighter versions of a couple of nerfs from 2013 and 2015, aimed at bringing his guaranteed burst down to size, since he has so much reliable damage already with Deathfire Grasp and 75% AP ratio Lich Bane.</p></blockquote><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/FizzQ.png\">Q - Urchin Strike</h4><ul><li><strong>Ability Power Ratio</strong>: 60% ⇒ <strong>40%</strong></li></ul><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/FizzW.png\">W - Seastone Trident</h4><ul><li><strong>Active Ability Power Ratio</strong>: 35% ⇒ <strong>20%</strong></li></ul><hr class=\"divider\"><p><strong>Kennen</strong></p><blockquote class=\"blockquote context\"><p>Kennen hasn't quite reached the same heights as his other ninja compatriots and we're confident he isn't performing as well as he should. AD Kennen needs substantially more help than his other builds, so we're skewing his buffs in ways to help those players out most of all</p></blockquote><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/KennenBringTheLight.png\">W - Electrical Surge</h4><ul><li><strong>Passive Damage</strong>: 40 / 50 / 60 / 70 / 80% total AD ⇒ <strong>25 / 40 / 55 / 70 / 85 + 100% bonus AD</strong></li></ul><hr class=\"divider\"><p><strong>Nautilus</strong></p><blockquote class=\"blockquote context\"><p>Unlike his other water-themed friends, Nautilus didn't come out swinging. Sometimes that anchor just weighs him down… Ultimately, he's weak in all three of his main roles (Support, Jungle, Top) and we'd like to help those latter two most of all. So we're fixing one major bug while pulling in buffs and reverting nerfs from early in his lifetime, giving him more reason to soak up experience and wade into the thick of the fight.</p></blockquote><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/passive/Nautilus_StaggeringBlow.png\">Passive - Staggering Blow</h4><ul><li><strong>Bug Fix</strong>: Fixed a bug where the empowered attack was critting for too much damage.</li></ul><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.17.1/img/spell/NautilusPiercingGaze.png\">W - Titan's Wrath</h4><ul><li><strong>Bug Fix</strong>: Fixed a bug where the shield wasn't factoring in armor or magic resistance.</li><li><strong>Damage over Time</strong>: 40 / 55 / 70 / 85 / 100 + 40% AP ⇒ <strong>40 / 65 / 90 / 115 / 140 + 40% AP</strong></li><li><strong>Shield Bonus Health Ratio</strong>: 10% ⇒ <strong>15%</strong></li><li><strong>Shield Duration</strong>: 9.75 ⇒ <strong>10</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Items</h4><blockquote class=\"blockquote context\"><p>Several of our tank items are underperforming. It turns out, they've got too little health regen, so they're being increased. And we have a shop display bugfix for Banshee's Veil so you can find it when searching for health items.</p></blockquote><p><strong>Spirit Visage</strong></p><ul><li><strong>Health per 5</strong>: 4 ⇒ <strong>20</strong></li></ul><p><strong>Force of Nature</strong></p><ul><li><strong>Health per 5</strong>: 20 ⇒ <strong>40</strong></li></ul><p><strong>Warmog's Armor</strong></p><ul><li><strong>Health per 5</strong>: 10 ⇒ <strong>30</strong></li></ul><p><strong>Banshee's Veil</strong></p><ul><li><strong>Stat Filter Filters</strong>: Ability Power ⇒ <strong>Health</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Bugfixes</h4><ul><li>Fixed a bug where an incorrect translation was displayed in Fizz's (E) ability description in a Classic match.</li><li>Fixed a bug where Shyvana's Burnout (W) could be cast while it was still active.</li><li>Fixed a bug where Miss Fortune's Splash Art used the Classic one for the Base.</li><li>Fixed a bug where Shyvana’s Dragon’s Descent (R) did not cancel channels.</li><li>Fixed a bug where Kayle's Reckoning (Q) applied on-hit effects.</li><li>Fixed a bug where Graves' Classic splash art was not displayed in the Collection tab, Loading Screen, Honor Screen, Progression Screen, or End of Game Scoreboard.</li><li>Fixed a bug where Champions Overview Role Icons did not match the listed Champions' Roles in the Classic Collection Menu.</li><li>Fixed a bug where Teemo did not regain the movement speed bonus from Move Quick (W) after death.</li><li>Fixed a bug where Graves' overview page did not display text under \"Classic Changes.\"</li><li>Fixed a bug where Nautilus' title \"The Titan of the Depths\" was not displayed under the champion's name.</li><li>Fixed a bug where Sion could lifesteal when attacking enemy Inhibitors.</li><li>Fixed a bug where Pantheon's Aegis Protection (P) text description contained an unlocalized string of text in the Classic Collection.</li><li>Fixed a bug where Quicksilver Sash, Mercurial Scimitar, or Gangplank's Remove Scurvy (W) could grant temporary vision while affected by Graves' Smoke Screen (W) Near Sighted Debuff.</li><li>Fixed a bug where owned Rune Pages could overflow the available content area and clip the Rune Editor or Statistics panel.</li><li>Fixed a bug where Classic Summoner's Spells played incorrect sound effects when cast.</li><li>Fixed grammatical and text formatting errors in Fiora's Classic Changes Overview and Abilities Preview tabs.</li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-aram:-mayhem\">ARAM: Mayhem</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><blockquote class=\"blockquote context\"><p>Hello Mayhemers!<br><br>This patch, we're giving some champions and Augments that need a little love some extra attention. For champions, we're introducing champion-specific buffs that strengthen their core play patterns while also making them more accessible and satisfying to play in Mayhem. For Augments, we're continuing to focus on usability improvements.<br><br>For example, Missile Split will now split when the missile reaches its end or is recast, rather than on the first target hit. We also lowered the cooldown on Triggered Inferno to show the real Samira fantasy. Let us know how these changes feel, and thank you for playing.<br><br>See you on the Bridge!</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">Champions</h4><p><strong>Bard</strong></p><ul><li><strong>Meep Ability Power Ratio</strong>: 50% ⇒ <strong>67%</strong></li><li><strong>Meep Recharge</strong>: 8s ⇒ <strong>5s</strong></li><li><strong>Meep Auto Damage per Chime Breakpoint</strong>: 6 per 3 chimes ⇒ <strong>10 per 3 chimes</strong></li></ul><p><strong>Garen</strong></p><ul><li><strong>Passive Regen</strong>: 1.5%–1.01% ⇒ <strong>2%–12%</strong></li><li><strong>W Cooldown</strong>: 22–12 ⇒ <strong>18–12</strong></li><li><strong>W Shield Strength</strong>: 18% Bonus Health ⇒ <strong>20% Bonus Health</strong></li><li><strong>W Passive Stacks</strong>: 0.4 per minion kill ⇒ <strong>0.75 per minion kill</strong></li></ul><p><strong>K'Sante</strong></p><ul><li><strong>W Cooldown</strong>: 14–10 ⇒ <strong>10</strong></li><li><strong>W Damage Reduction</strong>: 30% ⇒ <strong>45%</strong></li><li><strong>E Shield Strength</strong>: 13.5% bonus health ⇒ <strong>15% bonus health</strong></li></ul><p><strong>Lee Sin</strong></p><ul><li><strong>Passive Attack Speed</strong>: 40% bonus Attack Speed ⇒ <strong>50% bonus Attack Speed</strong></li><li><strong>Passive Energy Restore</strong>: 20 / 30 / 40 ⇒ <strong>30 / 40 / 50</strong></li><li><strong>W Shield</strong>: 60–240 ⇒ <strong>80–320</strong></li><li><strong>Q2 Damage</strong>: 60–180 ⇒ <strong>80–240</strong></li></ul><p><strong>Swain</strong></p><ul><li><strong>Damage Taken</strong>: 105% ⇒ <strong>100%</strong></li><li><strong>Healing</strong>: 95% ⇒ <strong>100%</strong></li><li><strong>Soul Fragments Restore</strong>: 6% flat ⇒ <strong>3%–6% scaling with level</strong></li></ul><p><strong>Thresh</strong></p><ul><li><strong>Passive Soul Drop</strong>: 2 ⇒ <strong>3</strong></li><li><strong>W Cooldown</strong>: 21 / 20 / 19 / 18 / 17s ⇒ <strong>19 / 18 / 17 / 16 / 15s</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Augments</h4><p><strong>Juiced</strong></p><ul><li><span style=\"background-color:#c12e26;\"><strong>&nbsp; REMOVED &nbsp;</strong></span>&nbsp;<strong>Mana Drain</strong>: Removed</li><li><strong>Damage-to-Mana Ratio</strong>: 4.5% ⇒ <strong>7%</strong></li><li><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Ranged Mod</strong>: 80% of the 7%</li></ul><p><strong>Leg Day</strong></p><ul><li><strong>Slow Resist</strong>: 40% ⇒ <strong>50%</strong></li></ul><p><strong>Missile Split</strong></p><ul><li><strong>Split Trigger</strong>: On first unit hit ⇒ <strong>On end or recast</strong></li></ul><p><strong>Shark Tempest</strong></p><ul><li><strong>Slow</strong>: 30% for 3s ⇒ <strong>40% for 3s</strong></li><li><strong>Base Area of Effect Damage</strong>: 50–100 ⇒ <strong>100–200</strong></li><li><strong>Attached Damage over 3s</strong>: 75–225 + 0.6 bonus AD + 0.36 AP ⇒ <strong>90–270 + 0.75 bonus AD + 0.45 AP</strong></li></ul><p><strong>Squishy Slappy Grab</strong></p><ul><li><strong>Cooldown</strong>: 35s ⇒ <strong>30s</strong></li><li><strong>Damage</strong>: 30–100 + 10% bonus Health ⇒ <strong>50–150 + 15% bonus Health</strong></li><li><strong>Shield per Target</strong>: 35–150 + 50% bonus Armor + 50% bonus Magic Resistance ⇒ <strong>50–200 + 50% bonus Armor + 50% bonus Magic Resistance</strong></li></ul><p><strong>Triggered Inferno</strong></p><ul><li><strong>Cooldown</strong>: 15s ⇒ <strong>5s</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">Bugfixes</h4><ul><li>Fixed a bug where Infernal Soul and Jeweled Gauntlet tracked damage dealt to minions.</li><li>Fixed a bug where King Me persisted in the slot after completing the quest.</li><li>Fixed a bug where King Me transmute to Overloaded causes Overloaded to be non-functional.</li><li>Fixed a bug where Shark Bait displayed an empty buff bar.</li><li>Fixed a bug where Aurora (Q) does not gain ability cooldown from the Skilled Sniper Augment.</li><li>Fixed a bug where Shen's Echo Cast Shadow Dash (E) fails to Dash when Shen flashed or queued another spell.</li><li>Fixed a bug where a move command can change Echo Cast's Clone direction.</li><li>Fixed a bug where Lucian's (W) missile fails to split with Spell Split augment when casting (E) during the spell cast.</li><li>Fixed a bug where Spell Split missiles do not split when casting a Summoner Spell during the ability's cast time.</li><li>Fixed a bug where champions are unable to queue other spells when casting an Ability enhanced by the Spell Split Augment.</li><li>Fixed a bug where Prom Queen's cooldown icon disappears upon death.</li><li>Fixed a bug where Urgot (W) missile would destroy Rite of Ascension's Soul.</li><li>Fixed a bug where Minion Mancer's damage amplification did not work on Shaco (R) Explosion and Ivern R's knockup.</li><li>Fixed a bug where Ultra Hydra's quest and card icon did not match up.</li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-aram\">ARAM</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Champions</h4><p><strong>Bel'Veth</strong></p><ul><li><strong>Damage Dealt</strong>: 105% ⇒ <strong>100%</strong></li><li><strong>Damage Taken</strong>: 95% ⇒ <strong>100%</strong></li><li><strong>Tenacity</strong>: 20% ⇒ <strong>0%</strong></li></ul><p><strong>Locke</strong></p><ul><li><strong>Damage Dealt</strong>: 105% ⇒ <strong>115%</strong></li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-ranked-5s\">Ranked 5s</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><blockquote class=\"blockquote context\"><p>In case you missed it, we've extended the queue windows for Ranked 5s from the previous 4pm-2am to 4pm-4am server time. We noticed</p></blockquote></div></div></div><header class=\"header-primary\"><h2 id=\"patch-bugfixes-and-qol-changes\">Bugfixes &amp; QoL Changes</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><ul><li>Fixed a bug where Orianna's (R) VFX and actual hitbox become misplaced if she casts (R) before the ball reaches a fast-moving ally like Nocturne.</li><li>Fixed a bug where a Sylas-stolen Depth Charge (R) from Nautilus could fizzle after Sylas lost vision of the target.</li><li>Fixed a bug where Xin Zhao's Three Talon Strike (Q) went completely on cooldown if the first attack was dodged by spells like Shen's Shadow Dash (E) or Jax's Counterstrike (E).</li><li>Fixed a bug where Shyvana's Dragon's Descent (R) ability fails to cancel enemy teleports.</li><li>Fixed a bug where Kayle's Reckoning (Q) applies the on-hit Spellblade effect from Sheen, Lich Bane, Trinity Force, and Iceborne Gauntlet.</li><li>Fixed a bug where large melee champions could auto large enemy champions and not be in immolate radius.</li><li>Fixed a bug where Rune page tabs overflow and clip the editor when owning more than 20 pages.</li><li>Fixed a bug where Sivir's Spell Shield (E) does not block Leona's Zenith Blade (E).</li><li>Fixed a bug where the tab buttons in the champion overview window are misaligned and unusable.</li><li>Fixed a bug where multiple Classic Spells icons fail to fill their entire square area.</li><li>Fixed a bug where Malphite's Flash summoner spell is disabled after using Unstoppable Force (R).</li><li>Fixed a bug where purchasing Royal Guard Fiora skin does not grant the Royal Guard Classic Chroma.</li><li>Fixed a bug where images from the Classic Mode Homepage loaded when logging into a non-Classic Mode tab.</li><li>Fixed a bug where the sorting effect is the same for the \"Release Date ↑\" and \"Release Date ↓\" selection buttons in the Collection - Portrait tab in Classic Mode.</li><li>Fixed a bug where the Recommended Sort Option is missing in Classic Store - Runes.</li><li>Fixed a bug where the Release Date Sort Option fails to sort Runes in a certain order in Classic Store - Runes.</li><li>Fixed a bug where rapidly pressing Recall gains Guinsoo's Rageblade stacks.</li><li>Fixed a bug where the Imperial Classic Chroma is missing its name in Champion Select's chroma selection for Xin Zhao.</li><li>Fixed a bug where Runaan's Hurricane Volley (P) triggers Minions' Call for Help.</li><li>Fixed a bug where Sivir's Spell Shield does not block damage from Miss Fortune's Q.</li><li>Fixed a bug where Sona's (E) ability description incorrectly states that its effect applies only to champions.</li><li>Fixed a bug where multiple Classic Items icons fail to fill their entire square area.</li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-upcoming-skins-and-chromas\">Upcoming Skins &amp; Chromas</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><p>The following skins will be released in
