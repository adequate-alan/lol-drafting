<!DOCTYPE html><html><body><script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"page": {"title": "League of Legends Patch 26.16 Notes", "url": "https://www.leagueoflegends.com/en-us/news/game-updates/league-of-legends-patch-26-16-notes/", "displayedPublishDate": "2026-08-11T18:00:00.000Z", "analytics": {"contentId": "e8c9c3b4-248c-40d2-a9db-706ef608d439.en-us", "contentLocale": "en-us", "rev": "IXkUD6YbqhSzZ9MGAPwzpI", "publishDate": "2026-08-11T18:00:00.000Z"}, "blades": [{"fragmentId": "26.16", "palette": "palette2", "richText": {"type": "html", "body": "<div id=\"patch-notes-container\"><h2 id=\"patch-top\">&nbsp;</h2><blockquote class=\"blockquote context\"><p>With this patch, we have a bunch of systems adjustments aimed at some of the strategies that have been emerging in bot lane, as well as opening up some space for itemization diversity in jungle.<br><br>Recently we've been seeing increased support roaming really early into the game, to the point where they seem to be operating as a second jungler. While this may be interesting as a strategic option, we feel it is damaging to game integrity when it's the default approach and supports are no longer meaningfully participating in a lane, so we're making higher tradeoffs for this playstyle by tweaking role quest progress for supports and directly addressing specific champions like Camille who have moved into the support role leading this meta.<br><br>Related, mages are picking up as a prominent class selection in bot lane in both pro and regular play. While they've been niche but powerful picks for a long time, both from your feedback and the stats, it's clear that it's time for some adjustments to equalize the power here a bit between mages and ADCs. Similar to the approach with supports above, they'll still be viable, just not clearly dominant.<br><br>Additionally, we are tweaking the AD fighter itemization space and the jungle pets to encourage a more diverse meta beyond Sundered Sky users to include more AP and Tank junglers. We're excited to see what shakes out next!<br><br>Looking for more information on all things League of Legends? Check out our community-run wiki <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://wiki.leagueoflegends.com/en-us/\"><i>here</i></a><i>!</i><br><br>Wrong patch notes? You can find the <i>TFT patch notes</i> <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://teamfighttactics.leagueoflegends.com/en-us/news/game-updates/teamfight-tactics-patch-17-9\"><i>here</i></a><i>!</i></p></blockquote><div class=\"context-designers\"><span class=\"context-designer\" style=\"text-align:left;\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/d6ee8f613c1959aa765e3d9827e7d7fb754123d8-220x220.jpg\"> Austin “Riot wroadie” Wright</span></div><div class=\"context-designers\"><span class=\"context-designer\" style=\"text-align:left;\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b36c216eac2e27319ed6c7a5df2dd25e449adee2-220x220.jpg\"> Erika “Riot Cashmiir” Haas</span></div><div class=\"context-designers\"><span class=\"context-designer\" style=\"text-align:left;\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/ca1ff9c14a7c22252e92199aec42db4e03d24806-300x300.jpg\"> Steven “Riot sternest” Earnest</span></div><div class=\"context-designers\"><span class=\"context-designer\" style=\"text-align:left;\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/45409ff80349212c8f1cbeef386720bc5ef756e4-300x300.jpg\"> Yina “Riot Yina” Wen</span></div><header class=\"header-primary\"><h2 id=\"patch-patch-highlights\">Patch Highlights</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><p><a class=\"skins cboxElement\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/4f1e79eef369bb3c524d5850d01dd378b5da03df-1920x1080.jpg\"><span class=\"content-border\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/4f1e79eef369bb3c524d5850d01dd378b5da03df-1920x1080.jpg\"></span></a></p><p>Faerie Court Bel'Veth, Faerie Court Gwen, and Faerie Court Lulu will be available August 12, 2026.</p></div></div></div><header class=\"header-primary\"><h2 id=\"patch-champions\">Champions</h2></header><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/azir/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.15.1/img/champion/Azir.png\"></a></p><h3 class=\"change-title\" id=\"patch-azir\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/azir/\">Azir</a></h3><blockquote class=\"blockquote context\"><p>We are continuing to monitor Azir, especially as players continue to pick up Press The Attack as his optimal keystone. For now however, we are going to give him a moderate buff to his laning to help him out.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.15.1/img/spell/AzirQWrapper.png\">Q - Conquering Sands</h4><ul><li><strong>Damage</strong>: 60 / 80 / 100 / 120 / 140 (+35 / 40 / 45 / 50 / 55% AP) ⇒ <strong>75 / 95 / 115 / 135 / 155 (+35 / 40 / 45 / 50 / 55% AP)</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/belveth/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.15.1/img/champion/Belveth.png\"></a></p><h3 class=\"change-title\" id=\"patch-belveth\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/belveth/\">Bel'Veth</a></h3><blockquote class=\"blockquote context\"><p>Bel'Veth has come out with the scaling curve of Kayle and Aurelion Sol. Her power is rapidly growing across all skill brackets and given her early game is already quite weak, we've opted to make her late game a bit less sharp.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">Base Stats</h4><ul><li><strong>Health Growth</strong>: 110 ⇒ <strong>105</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.15.1/img/spell/BelvethR.png\">R - Endless Banquet</h4><ul><li><strong>True Form Total Attack Speed</strong>: 5 / 15 / 25% ⇒ <strong>6 / 13 / 20%</strong></li><li><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>True Form Remora Indicator</strong>: Resource bar now turns purple when True Form can spawn Remora</li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/camille/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.15.1/img/champion/Camille.png\"></a></p><h3 class=\"change-title\" id=\"patch-camille\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/camille/\">Camille</a></h3><blockquote class=\"blockquote context\"><p>With roaming supports all the rage, Camille has been queen. We are simultaneously looking to nerf her support roaming power while keeping or (hopefully) actually buffing her top lane. This means trading the raw all in power behind her passive shield early game in favor of significantly lowered cooldowns for better repeatable trading.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">Base Stats</h4><ul><li><strong>Mana</strong>: 339 ⇒ <strong>375</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.15.1/img/passive/Camille_Passive.png\">Passive - Adaptive Defenses</h4><ul><li><strong>Shield</strong>: 20% Maximum Health ⇒ <strong>10 / 15 / 20 / 25% Maximum Health (levels 1 / 7 / 13 / 19)</strong></li><li><strong>Cooldown</strong>: 18 / 14 / 10 / 6s (levels 1 / 7 / 13 / 19) ⇒ <strong>14 / 11 / 8s (levels 1 / 7 / 13)</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.15.1/img/spell/CamilleW.png\">W - Tactical Sweep</h4><ul><li><strong>Cooldown</strong>: 15 / 14 / 13 / 12 / 11s ⇒ <strong>12 / 11.5 / 11 / 10.5 / 10s</strong></li><li><strong>Outer Cone Bonus Damage</strong>: 6 / 6.5 / 7 / 7.5 / 8% (+2.5% per 100 bonus Attack Damage) Target Maximum Health ⇒ <strong>7 / 7.5 / 8 / 8.5 / 9% (+2.5% per 100 bonus Attack Damage) Target Maximum Health</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/gwen/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.15.1/img/champion/Gwen.png\"></a></p><h3 class=\"change-title\" id=\"patch-gwen\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/gwen/\">Gwen</a></h3><blockquote class=\"blockquote context\"><p>Gwen has remained slightly weak since her nerfs earlier this year. We are buffing her passive sustain back up towards where it has previously been, which should help her be a powerful threat in some of her stronger matchups without making her feel uncounterable.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.15.1/img/passive/Gwen_Passive.png\">Passive - A Thousand Cuts</h4><ul><li><strong>Healing On Champions</strong>: 50% post-mitigation, capped to 10-25 (based on level) (+6.5% AP) ⇒ <strong>67% post-mitigation, capped to 12-40 (based on level) (+7% AP)</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/kennen/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.15.1/img/champion/Kennen.png\"></a></p><h3 class=\"change-title\" id=\"patch-kennen\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/kennen/\">Kennen</a></h3><blockquote class=\"blockquote context\"><p>With the reshape to Hextech Rocketbelt to prevent it from becoming the ubiquitous mage legendary, Kennen came out behind the pack. We are buffing him to compensate, making sure he is rewarded well when he does find the right flanks for those huge team-deleting ults.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.15.1/img/spell/KennenShurikenStorm.png\">R - Slicing Maelstrom</h4><ul><li><strong>Bonus Resistances</strong>: 20 / 40 / 60 ⇒ <strong>25 / 50 / 75</strong></li><li><strong>Damage</strong>: 40 / 75 / 110 (+22.5% AP) ⇒ <strong>40 / 80 / 120 (+25% AP)</strong></li><li><strong>Maximum Damage</strong>: 300 / 562.5 / 825 (+168.75% AP) ⇒ <strong>300 / 600 / 900 (+187.5% AP)</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/nasus/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.15.1/img/champion/Nasus.png\"></a></p><h3 class=\"change-title\" id=\"patch-nasus\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/nasus/\">Nasus</a></h3><blockquote class=\"blockquote context\"><p>Nasus has been a distinct jungle pick that we think is pretty exciting to see; however his top lane has lagged very far behind. We are adjusting his Q stack generation to bring these two roles closer to each other in raw power.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.15.1/img/spell/NasusQ.png\">Q - Siphoning Strike</h4><ul><li><strong>Stacks</strong>: 3, increased to 12 on champions / large minions / monsters ⇒ <strong>4, increased to 10 on champions / large minions / monsters</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/poppy/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.15.1/img/champion/Poppy.png\"></a></p><h3 class=\"change-title\" id=\"patch-poppy\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/poppy/\">Poppy</a></h3><blockquote class=\"blockquote context\"><p>Poppy is meant to be a tank whose gameplay has leaned too far into early game snowball fighter, to the point she's choosing Hail of Blades and Sundered Sky over more tank runes and items. We're looking to shift power out of her early game AD fighter pattern and enable her tank pattern by significantly increasing her scaling with durability and giving her enough mana growth that sustained combat doesn't immediately run her out of resources.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">Base Stats</h4><ul><li><strong>Attack Damage</strong>: 60 ⇒ <strong>56</strong></li><li><strong>Health Regeneration</strong>: 8 ⇒ <strong>9</strong></li><li><strong>Mana</strong>: 280 + 40/level ⇒ <strong>300 + 45/level</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.15.1/img/spell/PoppyQ.png\">Q - Hammer Shock</h4><ul><li><strong>Damage</strong>: 30 / 55 / 80 / 105 / 130 (+100% bonus Attack Damage) (+9% Target Maximum Health), twice ⇒ <strong>30 / 55 / 80 / 105 / 130 (+75% bonus Attack Damage) (+7 / 7.5 / 8 / 8.5 / 9% Target Maximum Health), twice</strong></li><li><strong>Target Maximum Health Monster Cap</strong>: 75 / 105 / 135 / 165 / 195 ⇒ <strong>85 / 120 / 155 / 190 / 225</strong></li><li><strong>Slow Amount</strong>: 20 / 25 / 30 / 35 / 40% ⇒ <strong>20 / 23 / 26 / 29 / 32% (+8% per 1000 bonus Health)</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title ability-title\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.15.1/img/spell/PoppyW.png\">W - Steadfast Presence</h4><ul><li><strong>Total Armor and Magic Resistance</strong>: 12%, doubled below 40% Maximum Health ⇒ <strong>16%, doubled below 40% Maximum Health</strong></li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-items\">Items</h2></header><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/0e32f582f77e13c9d12aa6e4973ce6854b71d3be-1080x1080.jpg\"></a></p><h3 class=\"change-title\" id=\"patch-Berserkers-Greaves\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\">Berserker's Greaves</a></h3><blockquote class=\"blockquote context\"><p>Berserker's Greaves have been sitting at a particularly low state of power for a while now, and with the state of AD champions in both bot and mid, we feel this is the right time to buff them.</p></blockquote><ul><li><strong>Attack Speed</strong>: 25% ⇒ <strong>30%</strong></li><li><strong>T3 Attack Speed</strong>: 40% ⇒ <strong>45%</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/078f4aceabfe8cf75e140e03223f11696e930d22-512x512.png\"></a></p><h3 class=\"change-title\" id=\"patch-Black-Cleaver\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\">Black Cleaver</a></h3><blockquote class=\"blockquote context\"><p>Black Cleaver has become a Smolder / Senna item more than a core AD fighter item. We are re-adding the Melee / Ranged split on the move speed effect to buy space to buff it for AD fighters without pushing it over the top for its ranged user base.</p></blockquote><ul><li><strong>Attack Damage</strong>: 40 ⇒ <strong>45</strong></li><li><strong>Fervor Move Speed</strong>: 20 for 2s ⇒ <strong>[20 Melee || 10 Ranged] for 2s</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/5989ddee5c636892399a87f15f5f95ce43f11b26-512x512.png\"></a></p><h3 class=\"change-title\" id=\"patch-Eclipse\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\">Eclipse</a></h3><blockquote class=\"blockquote context\"><p>Eclipse has similarly fallen behind as an option for AD champions as a high ticket early AD item that isn't in the Lethality space. We feel it has clear space for a buff.</p></blockquote><ul><li><strong>Damage</strong>: [6% Melee || 4% Ranged] Target Maximum Health ⇒ <strong>[8% Melee || 5% Ranged] Target Maximum Health</strong></li><li><strong>Shield</strong>: [160 + 40% bonus Attack Damage Melee || 80 + 20% bonus Attack Damage Ranged] ⇒ <strong>[150 + 40% bonus Attack Damage Melee || 75 + 20% bonus Attack Damage Ranged]</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/295d802fc4c2541bb3b93a76ea2c2fbcbd9967d5-512x512.jpg\"></a></p><h3 class=\"change-title\" id=\"patch-Runaans-Hurricane\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\">Runaan's Hurricane</a></h3><blockquote class=\"blockquote context\"><p>Runaan's Hurricane has lost all of its core users over the course of the year as ADCs have moved to a wider variety of AS Crit itemization. We are buffing its unique effect and movespeed to help players capitalize on the positioning requirements of that unique effect.</p></blockquote><ul><li><strong>Move Speed</strong>: 4% ⇒ <strong>5%</strong></li><li><strong>Wind's Fury Bolt Damage</strong>: 55% Attack Damage ⇒ <strong>65% Attack Damage</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/6c69ddde86705876c3894dfad0d1317d2e496d66-512x512.png\"></a></p><h3 class=\"change-title\" id=\"patch-Steraks-Gage\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\">Sterak's Gage</a></h3><blockquote class=\"blockquote context\"><p>Sterak's Gage has also lost its position as the premium juggernaut / diver teamfight item, with Guardian Angel taking its place. We think Sterak's is a much healthier fit for these champions to take.</p></blockquote><ul><li><strong>Bonus Attack Damage</strong>: 45% of Base Attack Damage ⇒ <strong>50% of Base Attack Damage</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/1da3c726b2c888fcadef76f75de1c24c1ed090cf-512x512.png\"></a></p><h3 class=\"change-title\" id=\"patch-Sundered-Sky\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\">Sundered Sky</a></h3><blockquote class=\"blockquote context\"><p>Sundered Sky, on the other hand, has been the meta dominant AD fighter item for the last year. While we do find it exciting to see when players manage to chain its triggers through a teamfight and barely survive risky engages, we think it's a bit too performant when optimized to the point where it's healing for more than even lifesteal based items.</p></blockquote><ul><li><strong>Recipe</strong>: Tunneler (1150g) + Caulfield's (1050g) + Ruby Crystal (400g) + 500g ⇒ <strong>Tunneler (1150g) + Caulfield's (1050g) + 900g</strong></li><li><strong>Healing</strong>: [100% Melee || 50% Ranged] Base Attack Damage + 6% Missing Health ⇒ <strong>[90% Melee || 45% Ranged] Base Attack Damage + 4% Missing Health</strong></li><li><strong>Health</strong>: 400 ⇒ <strong>450</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/c743b81ebbf9a8a8285bdf60c0af30e4d641309b-200x200.jpg\"></a></p><h3 class=\"change-title\" id=\"patch-Sunfire-Cape\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\">Sunfire Cape</a></h3><blockquote class=\"blockquote context\"><p>Sunfire Cape has remained a powerful item in League, both in purchase and winrate, but players have repeatedly called out dissatisfaction with the item because of how directly it's compared against Hollow Radiance. We are upping its cost to match Hollow Radiance and shifting its power towards PvP damage to give the item more comparable advantages.</p></blockquote><ul><li><strong>Damage</strong>: 20 (+1% bonus Health) ⇒ <strong>20 (+1.5% bonus Health)</strong></li><li><strong>Minion / Monster Modifier</strong>: 160% Minion, 200% Monster ⇒ <strong>150% Minion, 180% Monster</strong></li><li><strong>Recipe</strong>: 600g ⇒ <strong>700g</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/baec396740d4bc550d0069638d7fc35a01bd598e-512x512.png\"></a></p><h3 class=\"change-title\" id=\"patch-Chainlaced-Crushers\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\">Chainlaced Crushers</a></h3><blockquote class=\"blockquote context\"><p>We continue to feel that defensive boot optimizations in mid lane stifle action. Since we are looking to shift mage power back from bot lane to mid lane this patch, we are also taking the time to nerf down mid lane counter itemization against mages.</p></blockquote><ul><li><strong>Magic Resistance</strong>: 30 ⇒ <strong>25</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/0bbda1b75554118466ecdd8d95e46ea803595280-512x512.jpg\"></a></p><h3 class=\"change-title\" id=\"patch-Spellslingers-Shoes\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\">Spellslinger's Shoes</a></h3><blockquote class=\"blockquote context\"><p>Along with Chainlaced Crushers' change, we are buffing Spellslinger's Shoes to further affect mid vs bot mage balance.</p></blockquote><ul><li><strong>Magic Penetration</strong>: 18 + 8% ⇒ <strong>20 + 8%</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/7314607c6d5c915e3ba4b2ec1103185deed29083-512x512.png\"></a></p><h3 class=\"change-title\" id=\"patch-Tiamat\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\">Tiamat</a></h3><blockquote class=\"blockquote context\"><p>Tiamat has ended up in a state where even if you are buying a Hydra item, it's optimal NOT to purchase it until you have all the other components. That's pretty lame, yo.</p></blockquote><ul><li><strong>Attack Damage</strong>: 20 ⇒ <strong>25</strong></li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-runes\">Runes</h2></header><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/d676509226b6e267cdaeb7fe8cea75081a81ace8-256x256.png\"></a></p><h3 class=\"change-title\" id=\"patch-Fleet-Footwork\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\">Fleet Footwork</a></h3><blockquote class=\"blockquote context\"><p>Fleet Footwork has been a relatively weaker and underutilized Precision keystone, and we feel like it has room to be a decent option for sustaining against harass past early laning and onwards.</p></blockquote><ul><li><strong>Healing</strong>: 10-130 ( +[10% bonus AD Melee || 6% bonus AD Ranged]) ( +[5% AP Melee || 3% AP Ranged]) ⇒ <strong>15-160 ( +[10% bonus AD Melee || 6% bonus AD Ranged]) ( +[5% AP Melee || 3% AP Ranged])</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/c92f2d30fc0d1b84c74a65d1219f78d8906a5bde-256x256.png\"></a></p><h3 class=\"change-title\" id=\"patch-Hail-of-Blades\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/how-to-play/\">Hail of Blades</a></h3><blockquote class=\"blockquote context\"><p>Hail of Blades is currently contributing significantly to the extreme early game roaming meta with its super front loaded power skew. We are pushing its power back towards scaling to help soften this impact.</p></blockquote><ul><li><strong>Attack Speed</strong>: 120% Melee || 60% Ranged ⇒ <strong>90% Melee || 60% Ranged</strong></li><li><strong>Bonus True Damage</strong>: 4-20 (+8% bonus AD) (+6% AP) ⇒ <strong>2-20 (+12% bonus AD) (+10% AP)</strong></li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-systems\">Systems</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\"><strong>ADC MAGIC RESISTANCE</strong></h4><blockquote class=\"blockquote context\"><p>Finally, next to the changes to boot rewards in midlane, we are also adjusting MR for all ADC champions to help them out against mages early game. We also hope this will help a few of them in mid lane, where we believe a healthier pool of AD champions (including potentially Akshan and Tristana) will also help create a more diverse jungle meta beyond AD fighters.</p></blockquote><ul><li><strong>Affected Champions</strong>: Akshan, Aphelios, Ashe, Caitlyn, Corki, Draven, Ezreal, Graves, Jhin, Jinx, Kai'Sa, Kalista, Kindred, Kog'Maw, Lucian, Miss Fortune, Quinn, Samira, Senna, Sivir, Smolder, Twitch, Varus, Vayne, Xayah, Yunara, Zeri</li><li><strong>Magic Resistance</strong>: 30 + 1.3/level ⇒ <strong>33 + 1.1/level</strong></li><li><strong>Tristana Magic Resistance</strong>: 28 + 1.3/level ⇒ <strong>33 + 1.1/level</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\"><strong>JUNGLE PETS</strong></h4><blockquote class=\"blockquote context\"><p>Speaking of a more diverse jungle Meta, we are adjusting the way jungle pets scales to help mage and tank junglers against the current AD fighter meta.</p></blockquote><ul><li><strong>Damage Per Attack</strong>: 20 - 150 (based on level) (+10% bonus Attack Damage) (+12% Ability Power) (+20% bonus Armor) (+20% bonus Magic Resistance) (+3% bonus Health) ⇒ <strong>20 - 150 (based on level) (+10% bonus Attack Damage) (+16% Ability Power) (+25% bonus Armor) (+25% bonus Magic Resistance) (+4% bonus Health)</strong></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\"><strong>SUPPORT ROLE QUEST</strong></h4><blockquote class=\"blockquote context\"><p>Finally, we are adjusting Support Role Quest progress to penalize heavy early game roaming by increasing the penalty while outside of bot lane, and removing the bonus progress gained from champion combat over minion last hitting.</p></blockquote><ul><li><strong>Stack Consumption On Champion / Turret Damage</strong>: 22 Melee || 20 Ranged and 24 Melee || 22 Ranged ⇒ <strong>18 and 21</strong></li><li><strong>Stack Consumption On Creep Score</strong>: 15 and 20 ⇒ <strong>18 and 21</strong></li><li><strong>Minion Creep Score Experience / Gold Penalty</strong>: -25% outside of bot lane until level 3 ⇒ <strong>-33% outside of bot lane until level 5</strong></li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-classic\">Classic</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><blockquote class=\"blockquote context\"><p>Welcome to our first patch update for League Classic! We're delivering brand new old champions, brand new old runes, and a suite of balance changes aimed at the game's biggest outliers. Are you excited to be a flippin' Ninja?</p></blockquote></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\"><strong>CHAMPIONS</strong></h4><h4 class=\"change-detail-title\"><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;Akali</h4><blockquote class=\"blockquote context\"><p>Akali is flying in with invisibility, targeted dashes, invisibility, and tons of damage. Better buy a Pink Ward!</p></blockquote><hr class=\"divider\"><p><strong>Passive - Twin Disciplines</strong></p><ul><li>After gaining 20 Ability Power, gain a percent of your total Attack Damage as bonus damage on-hit.</li><li>After gaining 10 bonus Attack Damage, gain Spell Vamp.</li></ul><hr class=\"divider\"><p><strong>Q - Mark of the Assassin</strong></p><ul><li>Throw a kama, damaging and marking your target. Attack the marked target to deal more damage and refund some energy.</li></ul><hr class=\"divider\"><p><strong>W - Twilight Shroud</strong></p><ul><li>Throw down a smoke bomb, which gives Akali Invisibility and bonus resists while in the area. Enemies in the area are slowed.</li></ul><hr class=\"divider\"><p><strong>E - Crescent Slash</strong></p><ul><li>Slice all nearby enemies, dealing damage.</li><li>Be careful, this can empty your energy reserves quickly.</li></ul><hr class=\"divider\"><p><strong>R - Shadow Dance</strong></p><ul><li>Dash at an enemy, dealing damage upon arrival. This ability can hold a maximum of 3 dashes at a time, like ammo.</li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\"><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span><strong>&nbsp;Kennen</strong></h4><blockquote class=\"blockquote context\"><p>Kennen makes his return in a somewhat familiar form, ready to dive-bomb into enemy teams with Slicing Maelstrom or play it cool as an AD auto-attacker.</p></blockquote><hr class=\"divider\"><p><strong>Passive - Mark of the Storm</strong></p><ul><li>Kennen's abilities add stacking marks to their targets. Upon reaching 3 stacks, they're stunned and Kennen refunds some energy.</li></ul><hr class=\"divider\"><p><strong>Q - Thundering Shuriken</strong></p><ul><li>Throw a shuriken in a straight line, damaging and marking the first enemy hit.</li></ul><hr class=\"divider\"><p><strong>W - Electrical Surge</strong></p><ul><li>Passive: Every few attacks, Kennen's attack deals bonus damage and marks his target.</li><li>Active: Kennen damages and applies an additional mark to all nearby marked enemies.</li></ul><hr class=\"divider\"><p><strong>E - Lightning Rush</strong></p><ul><li>Kennen becomes a ball of lightning, gaining bonus movement speed and resistances. Enemies he collides with while a ball of lightning are damaged and marked.</li></ul><hr class=\"divider\"><p><strong>R - Slicing Maelstrom</strong></p><ul><li>A maelstrom follows Kennen for a few seconds, damaging and marking a random enemy champion several times per second.</li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\"><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;Shen</h4><blockquote class=\"blockquote context\"><p>Shen subscribes to the philosophy that one can hide in plain sight. He's still the same dashing, taunting ninja he's always been, but has the added benefit of providing healing for himself and his allies.</p></blockquote><hr class=\"divider\"><p><strong>Passive - Ki Strike</strong></p><ul><li>Every few seconds, Shen's next attack deals bonus damage and restores some energy.</li><li>Further basic attacks ready his next empowered attack sooner.</li></ul><hr class=\"divider\"><p><strong>Q - Vorpal Blade</strong></p><ul><li>Throw a blade, damaging and marking the targeted enemy. Any time Shen or his allies attack the marked enemy, they restore some health over time.</li><li>If the blade kills the target outright, Shen gets a partial heal.</li></ul><hr class=\"divider\"><p><strong>W - Feint</strong></p><ul><li>Gain a shield. While it persists, attacks refresh Ki Strike faster.</li></ul><hr class=\"divider\"><p><strong>E - Shadow Dash</strong></p><ul><li>Dash in a straight line, taunting and damaging all champions Shen collides with and restoring energy for each one.</li></ul><hr class=\"divider\"><p><strong>R - Stand United</strong></p><ul><li>Target an allied champion anywhere on the map to grant them a shield. After a few seconds, if they're still alive, teleport to that ally.</li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Alistar</h4><blockquote class=\"blockquote context\"><p>Alistar's pretty decent in both solo lanes, whether played as AP burst or as a Headbutt-autoattacker. However, he's quite weak at support, so we're looking for some support-skewed buffs.</p></blockquote><hr class=\"divider\"><p><strong>E - Triumphant Roar</strong></p><ul><li><strong>Allied Heal Effectiveness</strong>: 50% ⇒ <strong>75%</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Amumu</h4><blockquote class=\"blockquote context\"><p>Amumu is performing worse than he ought to, so we're looking to return him back to normalcy. We're reverting some nerfs from 2012-2013, ensuring he has a strong strategic niche of helping AP teams destroy squishy targets</p></blockquote><hr class=\"divider\"><p><strong>Passive - Cursed Touch</strong></p><ul><li><strong>Magic Resistance Shred</strong>: 15 / 20 / 25 ⇒ <strong>15 / 25 / 35 (levels 1 / 7 / 13)</strong></li><li><strong>Shred Duration</strong>: 3s ⇒ <strong>4s</strong></li></ul><hr class=\"divider\"><p><strong>Q - Bandage Toss</strong></p><ul><li><strong>Base Damage</strong>: 80 / 130 / 280 / 230 / 280 ⇒ <strong>80 / 140 / 200 / 260 / 320</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Blitzcrank</h4><blockquote class=\"blockquote context\"><p>Blitzcrank is the #1 support in the game right now, topping all three of win rate, pick rate, and ban rate. So yeah, it's time for some nerfs to pull him down. We're digging up the history books and reverting some of their “recent” buffs from 2011-2012. We're targeting early pressure and overall cooldowns, due to how impactful their abilities can be. If a hook attempt misses, their opponents should have plenty of time to punish.</p></blockquote><hr class=\"divider\"><p><strong>Q - Rocket Grab</strong></p><ul><li><strong>Base Damage</strong>: 80 / 135 / 190 / 245 / 300 ⇒ <strong>60 / 120 / 180 / 240 / 300</strong></li><li><strong>Cooldown</strong>: 20 / 19 / 18 / 17 / 16 ⇒ <strong>22 / 21 / 20 / 19 / 18</strong></li></ul><hr class=\"divider\"><p><strong>W - Overdrive</strong></p><ul><li><strong>Cooldown</strong>: 15 ⇒ <strong>20</strong></li></ul><hr class=\"divider\"><p><strong>R - Static Field</strong></p><ul><li><strong>Active Damage</strong>: 250 / 375 / 500 ⇒ <strong>200 / 300 / 400</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Dr. Mundo</h4><blockquote class=\"blockquote context\"><p>Dr. Mundo's faring even worse than his patients, and that's saying something! He's receiving a suite of buffs to both damage and durability to allow him to soak up as much punishment as possible while still dishing out the pain. These buffs manifest as reverts to nerfs from early 2012.</p></blockquote><hr class=\"divider\"><p><strong>W - Burning Agony</strong></p><ul><li><strong>Damage Per Second</strong>: 35 / 50 / 65 / 80 / 95 ⇒ <strong>40 / 55 / 70 / 85 / 100</strong></li><li><strong>Tenacity</strong>: 10 / 15 / 20 / 25 / 30% ⇒ <strong>15 / 20 / 25 / 30 / 35%</strong></li></ul><hr class=\"divider\"><p><strong>R - Sadism</strong></p><ul><li><strong>Health Regained</strong>: 40 / 50 / 60% ⇒ <strong>40 / 55 / 70%</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Garen</h4><blockquote class=\"blockquote context\"><p>Garen's doing quite poorly at the moment, so we're here to buff him up to snuff. We want him to feel advantaged in early laning, so we're buffing his early regeneration to enable more aggressive trading and allowing him more frequent access to his rank 1 ultimate to let him convert those fights into kills.</p></blockquote><hr class=\"divider\"><p><strong>Base Stats</strong></p><ul><li><strong>Base Health Regeneration</strong>: 8.2 ⇒ <strong>9.0</strong></li></ul><hr class=\"divider\"><p><strong>Passive - Perseverance</strong></p><ul><li><strong>Maximum Health Per Second Regeneration</strong>: 0.4% ⇒ <strong>0.5%</strong></li></ul><hr class=\"divider\"><p><strong>R - Demacian Justice</strong></p><ul><li><strong>Cooldown</strong>: 160 / 120 / 80 ⇒ <strong>140 / 110 / 80</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Heimerdinger</h4><blockquote class=\"blockquote context\"><p>Heimerdinger is the single best-performing mid laner, and he's way up there in top lane, too. We expect him to do well for now, considering how rusty the average player is, and how strong his turrets are, but he's still outperforming our expectations. We want to make him more vulnerable early in his turret fortress and create a larger window without his pocket crowd control. For the rockets, they simply lack the early game counter-play required for a base damage this high.</p></blockquote><hr class=\"divider\"><p><strong>Q - H-28G Evolution Turret</strong></p><ul><li><strong>Base Attack Damage</strong>: 30 / 38 / 46 / 54 / 62 ⇒ <strong>28 / 36 / 44 / 52 / 60</strong></li></ul><hr class=\"divider\"><p><strong>W - Hextech Micro-Rockets</strong></p><ul><li><strong>Base Damage</strong>: 85 / 135 / 185 / 235 / 285 ⇒ <strong>70 / 120 / 170 / 220 / 270</strong></li></ul><hr class=\"divider\"><p><strong>E - CH-1 Concussion Grenade</strong></p><ul><li><strong>Cooldown</strong>: 13 / 12 / 11 / 10 / 9 ⇒ <strong>14 / 13 / 12 / 11 / 10</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Janna</h4><blockquote class=\"blockquote context\"><p>Janna is the second of our support nerfs this patch as she's performing a little better than she ought to, so we're dropping some small nerfs. We want her high impact ultimate to have high a impact mana cost and want to make sure that she isn't just using her strong safety tools to bully her enemies out of the lane.</p></blockquote><hr class=\"divider\"><p><strong>Base Stats</strong></p><ul><li><strong>Attack Damage</strong>: 51.95 + 2.95 ⇒ <strong>49 + 3</strong></li></ul><hr class=\"divider\"><p><strong>R - Monsoon</strong></p><ul><li><strong>Mana Cost</strong>: 100 / 150 / 200 ⇒ <strong>200 / 275 / 350</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Jarvan IV</h4><blockquote class=\"blockquote context\"><p>Jarvan is one of the game's strongest junglers and deserving of a nerf. Considering how good the reliably Flag and Drag combo is, we're leaving that intact. Instead, we're swinging for his late game to ensure he isn't the best at all points in time.</p></blockquote><hr class=\"divider\"><p><strong>Base Stats</strong></p><ul><li><strong>Armor Per Level</strong>: 3.6 ⇒ <strong>3</strong></li></ul><hr class=\"divider\"><p><strong>W - Golden Aegis</strong></p><ul><li><strong>Bonus Shield Per Nearby Champion</strong>: 20 / 30 / 40 / 50 / 60 ⇒ <strong>20 / 25 / 30 / 35 / 40</strong></li></ul><hr class=\"divider\"><p><strong>E - Demacian Standard</strong></p><ul><li><strong>Mana Cost</strong>: 55 ⇒ <strong>55 / 60 / 65 / 70 / 75</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Katarina</h4><blockquote class=\"blockquote context\"><p>Katarina is performing much better than she ought to, especially for a difficult champion whom no one has played for approximately a decade. We always want high-mastery champions to be worth mastering, but if rookies are winning this much without practice, something's wrong. Ultimately we're fixing our own bug here: She's supposed to be throwing 10 daggers over 2.5 seconds, not 12, so both the DPS and maximum damage of her ultimate is being reduced.</p></blockquote><hr class=\"divider\"><p><strong>R - Death Lotus</strong></p><ul><li><strong>Maximum Damage</strong>: 480 / 690 / 900 + 450% bonus Attack Damage + 300% Ability Power ⇒ <strong>400 / 575 / 750 + 375% bonus Attack Damage + 250% Ability Power</strong></li><li><strong>Damage Per Dagger</strong>: Unchanged</li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Lux</h4><blockquote class=\"blockquote context\"><p>Lux is our single worst mid laner AND support right now, so she's due for some very real buffs. We're going back on a move speed and ult CD nerf from early in 2013, as well as an AP ratio nerf from 2011, with the hopes that Lux can keep up with all the mobility these “modern” (released after 2010) champions have.</p></blockquote><hr class=\"divider\"><p><strong>Base Stats</strong></p><ul><li><strong>Move Speed</strong>: 330 ⇒ <strong>340</strong></li></ul><hr class=\"divider\"><p><strong>R - Final Spark</strong></p><ul><li><strong>Cooldown</strong>: 80 / 65 / 50 ⇒ <strong>80 / 60 / 40</strong></li><li><strong>Damage</strong>: 300 / 400 / 500 + 75% Ability Power ⇒ <strong>300 / 400 / 500 + 85% Ability Power</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Miss Fortune</h4><blockquote class=\"blockquote context\"><p>Miss Fortune is performing the worst of all conventional bot laners, so we're delivering some buffs. To start, we're improving both her sustained auto-attack damage and her spell casting ult playstyle, partially or fully reverting changes from patches 3.1 and 3.7.&nbsp;</p><hr class=\"divider\"><p><strong>W - Impure Shots</strong></p></blockquote><ul><li><strong>Bonus Damage Per Stack</strong>: 4 / 6 / 8 / 10 / 12 ⇒ <strong>6 / 8 / 10 / 12 / 14</strong></li><li><strong>Maximum Stacks</strong>: 5 ⇒ <strong>4</strong></li><li><strong>Maximum Bonus Damage</strong>: 20 / 30 / 40 / 50 / 60 ⇒ <strong>24 / 32 / 40 / 48 / 56</strong></li></ul><hr class=\"divider\"><p><strong>R - Bullet Time</strong></p><ul><li><strong>Damage Per Wave</strong>: 65 / 95 / 125 + 35% bonus Attack Damage ⇒ <strong>65 / 95 / 125 + 40% bonus Attack Damage</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Nasus</h4><blockquote class=\"blockquote context\"><p>Nasus is performing better than he ought to, even for a champion with a shallow learning curve and a playstyle that hasn't changed much over the years. We still want his infinitely-stacking late game bonking to be his biggest strength, which means pulling out power elsewhere. We're reverting a few buffs from the Skarner launch patch in 2011, making his early game weaker and making him think more carefully about using Wither.&nbsp;</p><hr class=\"divider\"><p><strong>Passive - Soul Eater</strong></p></blockquote><ul><li><strong>Life Steal</strong>: 14 / 17 / 20% ⇒ <strong>10 / 15 / 20%</strong></li></ul><hr class=\"divider\"><p><strong>W - Wither</strong></p><ul><li><strong>Mana Cost</strong>: 80 ⇒ <strong>100</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Skarner</h4><blockquote class=\"blockquote context\"><p>Skarner has been one of the weakest junglers so we're here to buff him back up. We've got a small bugfix to his E's missile radius, which made it harder to hit than it should have been. Otherwise, we're reverting a few nerfs that Skarner received early in his release.</p></blockquote><hr class=\"divider\"><p><strong>Passive - Energize</strong></p><ul><li><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Structure Interaction</strong>: Once again works on structures</li></ul><hr class=\"divider\"><p><strong>Q - Crystal Slash</strong></p><ul><li><strong>Slow</strong>: 20 / 25 / 30 / 35 / 40% ⇒ <strong>25 / 30 / 35 / 40 / 45%</strong></li></ul><hr class=\"divider\"><p><strong>W - Crystalline Exoskeleton</strong></p><ul><li><strong>Cooldown</strong>: 18 ⇒ <strong>14</strong></li></ul><hr class=\"divider\"><p><strong>E - Fracture</strong></p><ul><li><strong>Missile Width</strong>: 70 ⇒ <strong>120</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Soraka</h4><blockquote class=\"blockquote context\"><p>Soraka is one of our weakest supports at the moment, and while she performs better in solo lanes, she's not strong there either. As a result we're looking for some meaningful support-skewed buffs and it's fine if she gets a little stronger in top lane or mid lane. As support Soraka maxes her W first while solo lane Soraka does not, this should be a meaningful buff for where she's played most.</p></blockquote><hr class=\"divider\"><p><strong>W - Astral Blessing</strong></p><ul><li><strong>Armor Buff</strong>: 25 / 45 / 65 / 85 / 105 ⇒ <strong>25 / 50 / 75 / 100 / 125</strong></li><li><strong>Armor Buff Duration</strong>: 3 seconds ⇒ <strong>5 seconds</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Tryndamere</h4><blockquote class=\"blockquote context\"><p>Tryndamere has wound up as the single most performant champion in the game, both in top lane and jungle, which means he's up for some substantial nerfs. We want to retain his late game big crit fantasy but he should take longer to get there and be more peelable when he does. As with many of our nerfs, these are reverts of buffs from back when Lux launched in 2010.</p></blockquote><hr class=\"divider\"><p><strong>Q - Bloodlust</strong></p><ul><li><strong>Cooldown</strong>: 12 / 11 / 10 / 9 / 8 ⇒ <strong>14 / 12.5 / 11 / 9.5 / 8</strong></li><li><strong>Bonus Attack Damage Per Fury</strong>: 5 ⇒ <strong>3</strong></li><li><strong>Maximum Bonus Attack Damage</strong>: 40 ⇒ <strong>24</strong></li></ul><hr class=\"divider\"><p><strong>E - Spinning Slash</strong></p><ul><li><strong>Cooldown</strong>: 8 ⇒ <strong>9</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Twitch</h4><blockquote class=\"blockquote context\"><p>Twitch is the strongest bot laner in the game right now. To start, our nerfs are going to be reverting his buffs from 1.0.0.144 and 1.0.0.146, both from 2012. Because his late game can be so potent, we're doubling down on his scaling archetype and making his laning phase even more difficult.</p></blockquote><hr class=\"divider\"><p><strong>Base Stats</strong></p><ul><li><strong>Attack Damage</strong>: 52 ⇒ <strong>50</strong></li></ul><hr class=\"divider\"><p><strong>W - Venom Cask</strong></p><ul><li><strong>Projectile Speed</strong>: 1400 ⇒ <strong>1300</strong></li></ul><hr class=\"divider\"><p><strong>E - Expunge</strong></p><ul><li><strong>Mana Cost</strong>: 50 / 60 / 70 / 80 / 90 ⇒ <strong>70 / 75 / 80 / 85 / 90</strong></li></ul><hr class=\"divider\"><p><strong>R - Spray And Pray</strong></p><ul><li><strong>Missile Speed</strong>: 5000 ⇒ <strong>4000</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Veigar</h4><blockquote class=\"blockquote context\"><p>Veigar is one of the very worst mid laners in the game, so it's time for some buffs. Due to how core Q-spamming on every minion is to his playstyle, we want to make sure it feels supported, while still requiring him to buy some mana items to keep up.</p></blockquote><hr class=\"divider\"><p><strong>Q - Baleful Strike</strong></p><ul><li><strong>Mana Cost</strong>: 60 / 65 / 70 / 75 / 80 ⇒ <strong>50 / 55 / 60 / 65 / 70</strong></li><li><strong>Damage</strong>: 80 / 125 / 170 / 215 / 260 + 60% Ability Power ⇒ <strong>80 / 125 / 170 / 215 / 260 + 65% Ability Power</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Warwick</h4><blockquote class=\"blockquote context\"><p>Warwick is the best-performing jungler in the game right now, and while his resilience in the face of a dangerous jungle is likely a contributor, he's performing above our expectations for such a straightforward jungler. We're reverting an attack speed buff from early 2012, as he has access to much better on-hit itemization than he used to.</p></blockquote><hr class=\"divider\"><p><strong>Base Stats</strong></p><ul><li><strong>Attack Speed</strong>: .679 ⇒ <strong>.644</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\"><strong>RUNES</strong></h4><p><strong>Rune Balance</strong></p><blockquote class=\"blockquote context\"><p>We're increasing the default stat value of the placeholder rune slots in Classic to be 80% of the equivalent rune rather than 66%.</p></blockquote><ul><li><strong>Default Placeholder Rune Power</strong>: 66% ⇒ <strong>80%</strong></li><li><strong>Scaling Armor Seals</strong>: Increased to 0.17 armor per level from 0.15 Armor per level.</li></ul><hr class=\"divider\"><p><strong>New Runes</strong></p><blockquote class=\"blockquote context\"><p>We've added the following runes to the Classic Store:</p></blockquote><hr class=\"divider\"><p><strong>Marks</strong></p><ul><li>Minor Mark of Ability Power: <strong>0.7 AP</strong></li></ul><hr class=\"divider\"><p><strong>Seals</strong></p><ul><li>Seal of Energy Regeneration: <strong>0.7 Energy per 5s</strong></li></ul><hr class=\"divider\"><p><strong>Glyphs</strong></p><ul><li>Glyph of Energy: <strong>2.3 Max Energy</strong></li><li>Minor Glyph of Mana Regeneration: <strong>0.33 Mana per 5s</strong></li></ul><hr class=\"divider\"><p><strong>Quintessences</strong></p><ul><li>Quintessence of Energy: <strong>6 Max Energy</strong></li><li>Quintessence of Energy Regeneration: <strong>1.8 Energy per 5s</strong></li><li>Quintessence of Health Regeneration: <strong>1.3 Health per 5s</strong></li><li>Quintessence of Mana: <strong>38 Maximum Health</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\"><strong>SYSTEMS</strong></h4><p><strong>Classic Gold Generation</strong></p><blockquote class=\"blockquote context\"><p>League Classic has higher stakes and is generally more snowbally than Season 2026 and that's intentional. We also want players to have a fighting chance at comebacks without adding systems like Objective Bounties that players have to identify and play around. We also don't want to inflate total gold in the game too heavily.<br><br>So we're raising the floor on passive gold income and reducing the income of those who farm the best. As a whole, these changes will result in all champions having about 215 more gold passively, with the average laner roughly treading water.</p></blockquote><ul><li><strong>Start of Ambient Gold Generation</strong>: 65 seconds ⇒ <strong>90 seconds</strong></li><li><strong>Passive Gold Per 5 Seconds</strong>: 8 / 10.5 / 11.5 / 13 at 1 / 10 / 15 / 25 minutes ⇒ <strong>10.5 / 11.5 / 13 at 1 / 15 / 25 minutes</strong></li><li><strong>Melee Minion Base Gold Value</strong>: 20 ⇒ <strong>19</strong></li><li><strong>Ranged Minion Base Gold Value</strong>: 15 ⇒ <strong>14</strong></li></ul><hr class=\"divider\"><p><strong>Classic Homeguards</strong></p><blockquote class=\"blockquote context\"><p>We want the early game to have high stakes but that doesn't mean a single kill should spell doom for the next 30 minutes straight. As a result, there's a careful balance to strike between properly rewarding the victor for an early kill and helping losing players have something to look forward to. One of our attempts to strike that balance was early game Homeguards, which shipped with Classic last patch. This moderate 10% move speed buff should only shave a second or two off of someone's walk back to lane but your feedback that it feels too modern has been heard. We're keeping the mid-game version of Homeguard, which exists to help winning teams cross the map and continue sieging, but the early game one is being removed. In its place, we're reducing early game death timers by a couple seconds. No new mechanics to learn and winners still get ahead, but losers can get back in there and earn XP and gold to look for their comeback.</p></blockquote><ul><li><strong>Homeguard Activation</strong>: 0 minutes ⇒ <strong>15 minutes</strong></li><li><strong>Death Timers</strong>: 12 / 14 / 16 / 19 / 22 / 25 / 28 / 30 ⇒ <strong>10 / 12 / 14 / 17 / 20 / 23 / 26 / 29 (levels 1-8)</strong></li><li><strong>Death Timers At Levels 9+</strong>: Unchanged ⇒ <strong>Unchanged</strong></li></ul><hr class=\"divider\"><p><strong>Classic Jungle Tuning</strong></p><blockquote class=\"blockquote context\"><p>When porting over jungle monsters to modern systems, we miscalculated how durable regular jungle monsters would become in the mid and late game. This global health scaling buff will make camps more closely match their histories. Your first clear won't be affected at all, and non-epic monsters will scale up to 5-25% more health than they had before.</p></blockquote><ul><li><strong>Maximum Health Scaling</strong>: 250% ⇒ <strong>315%</strong></li></ul><hr class=\"divider\"><p><strong>Classic Turrets</strong></p><blockquote class=\"blockquote context\"><p>Despite having the same effective HP they had in 2013, player feedback has been overwhelming that turrets feel too squishy. And they're certainly much frailer than 2026's norms. As we want turrets to matter and feel important, we agree that they could stand to hold up better, so we're buffing their health by around 15% across the board and nerfing the AP ratio to on-hit damage conversion against towers.</p></blockquote><ul><li><strong>Outer Turret Health</strong>: 3000 ⇒ <strong>3500</strong></li><li><strong>Inner Turret Health</strong>: 3250 ⇒ <strong>3750</strong></li><li><strong>Inhibitor Turret Health</strong>: 3500 ⇒ <strong>4000</strong></li><li><strong>Nexus Turret Health</strong>: 2600 ⇒ <strong>2750</strong></li><li><strong>Champion Damage To Turrets</strong>: 100% total Attack Damage + 40% Ability Power ⇒ <strong>100% total Attack Damage + 20% Ability Power</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\"><strong>BUGFIXES &amp; QoL CHANGES</strong></h4><ul><li>Classic Level Progression has been added to the Classic Home tab</li><li>In champion select, players can hover on another player to mute chat or report</li><li>Fixed a bug where Wukong would gain gold from Twisted Fate passive from his own clones</li><li>Fixed a bug where Trinity Force / Phage would play a sound effect whenever they trigger movespeed buff</li><li>Fixed multiple bugs with show minimap on the left option</li><li>Fixed a bug where Tibbers would heal enemy champions and drain their mana</li><li>Fixed a bug where Tear of the Goddess would not stack from spell casts that don't cost mana</li><li>Fixed a bug where Tear of the Goddess would stack multiple times from abilities like Corki Gatling Gun</li><li>Fixed a bug where Manamune Awe passive would not properly grant AD from mana</li><li>Fixed a bug where Master Yi E cooldown was lower than intended</li><li>Fixed a bug where Warwicks Hunter's call (W) duration was higher than intended</li><li>Fixed a bug where Ezreal had lower base AD than intended</li><li>Fixed a bug where Kassadin's Rift Walk (R) had a higher AP Ratio than intended</li><li>Fixed a bug where the Cold Steel passive was not unique</li><li>Fixed a bug where Sivir Q was interrupted by CC</li><li>Fixed multiple bugs with Sivir E not blocking certain spells</li><li>Fixed a bug where Spellsword mastery was not scaling with AP</li><li>Fixed a bug where Ancient Golem's attack damage was lower than intended</li><li>Fixed a bug where Ashe would gain additional attack damage at certain levels</li><li>Fixed a bug where Amumu's R would stop unstoppable units</li><li>Fixed a bug where Sivir passive procced on non-champion units</li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\"><strong>CLASSIC SKINS AND COSMETICS</strong></h4><blockquote class=\"blockquote context\"><p>Miss Fortune and all three of our new old ninja champions have <strong>updated base classic skins</strong>, as well as new looks for Akali and Shen that can be selected as <strong>chromas</strong> for players who own the skins:</p></blockquote><ul><li>Classic Akali (Stinger)</li><li>Classic Miss Fortune (Waterloo)</li><li>Classic Shen (Yellowjacket)</li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-aram:-mayhem\">ARAM: Mayhem</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><blockquote class=\"blockquote context\"><p>Hello Mayhemers! In this patch, we're focusing on improving the fighter experience.<br><br>We've added two new Gold Augments that upgrade fighter items: Upgrade Sundered Sky and Upgrade Ravenous Hydra.<br><br>Our goal is to give fighters more options for sustaining themselves during extended team fights and to better support their frontline playstyle.<br><br>We're also continuing to improve the quality of Augments.<br><br>We've noticed that some of them lacked a clear audience or gameplay fantasy, so we've updated Augments like Nature is Healing and Night Stalking to better define their intended use cases and make them more satisfying to pick.<br><br>On the bug-fixing front, we've resolved an issue where form swapping champions such as Jayce and Nidalee could enjoy the melee stats from Augments like Scopiest Weapon and Glass Cannon when they're in range form.<br><br>We'll continue improving the quality and clarity of Gold Augments.<br><br>Thanks for playing, and we'll see you on the Bridge! (or Abyss, or Crossing)</p></blockquote></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\"><strong>CHAMPIONS</strong></h4><p><strong>Locke</strong></p><ul><li><strong>Damage Dealt</strong>: 100% ⇒ <strong>105%</strong></li><li><strong>Damage Taken</strong>: 100% ⇒ <strong>95%</strong></li><li><strong>Tenacity</strong>: 0 ⇒ <strong>20</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\"><strong>AUGMENTS</strong></h4><p><strong>Skilled Sniper and Quest Bang Bang</strong></p><ul><li><strong>Snipe Range</strong>: 700 ⇒ <strong>600</strong></li></ul><hr class=\"divider\"><p><strong>Soul Eater</strong></p><ul><li><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Second Augment Bonus Health</strong>: <strong>300</strong></li></ul><hr class=\"divider\"><p><strong>Nightstalking</strong></p><ul><li><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Move Speed During the Buff</strong>: <strong>40%</strong></li></ul><hr class=\"divider\"><p><strong>Snowbomb</strong></p><ul><li><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Radius</strong>: <strong>30% larger</strong></li><li><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Knockup Duration</strong>: <strong>Increased</strong></li></ul><hr class=\"divider\"><p><strong>Shark Bait</strong></p><ul><li><strong>Base Damage</strong>: 80-300 ⇒ <strong>120-350</strong></li><li><strong>Missing Health Damage</strong>: 20% ⇒ <strong>30%</strong></li></ul><hr class=\"divider\"><p><strong>Critical Missile</strong></p><ul><li><strong>Per Missile Damage</strong>: 15-85 ⇒ <strong>15-65</strong></li></ul><hr class=\"divider\"><p><strong>Chain Reaction</strong></p><ul><li><strong>Tier</strong>: Prismatic ⇒ <strong>Gold</strong></li></ul><hr class=\"divider\"><p><strong>Nature is Healing</strong></p><ul><li>Each bush has an independent cooldown and heals only on entry.</li><li><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Heal</strong>: <strong>40-300 +15% missing Health</strong></li><li><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Cooldown</strong>: <strong>20 seconds</strong></li></ul><hr class=\"divider\"><p><strong>Upgrade Sundered Sky</strong></p><ul><li><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Item Cooldown Per Target</strong>: <strong>5 seconds</strong></li><li><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Missing Health Healing</strong>: <strong>9%</strong></li></ul><hr class=\"divider\"><p><strong>Upgrade Ravenous Hydra</strong></p><ul><li><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Cleave Application</strong>: <strong>Your spell applies the cleave effect with no cooldown</strong></li><li><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Life Steal</strong>: <strong>18%</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\"><strong>BUGFIXES</strong></h4><ul><li>Fixed a bug where Summoner Cleanse and Summoner Clarity were not pickable in ARAM.</li><li>Fixed a bug where Pursuit of Power affected Locke (P) damage after its quest was completed.</li><li>Fixed a bug where Veigar's W in ARAM Mayhem did not trigger Archmage's cooldown refund effect.</li><li>Fixed a bug where Archmage did not refund Azir (W) properly.</li><li>Fixed a bug where Marksmage did not apply its damage to certain empowered attacks in Mayhem, including Blitzcrank (E), Nasus (Q), and Trundle (Q).</li><li>Fixed a bug where Annie's (R) would go on cooldown if the first Tibbers died when having Ultimate Revolution.</li><li>Fixed a bug where champions would lose Hellbent cooldown if they have revive passives.</li><li>Fixed a bug where Augment damages can stack Samira passive (P).</li><li>Fixed a bug where Lissandra passive (P) consumes gold from Yowch My Coins.</li><li>Fixed a bug where Dashing did not apply to Lee Sin Q, Kled Q, and Rek'Sai E.</li><li>Fixed a bug where Skilled Sniper did not trigger on Vel'Koz's split Q.</li><li>Fixed a bug where form-swapping champions had incorrect damage ratio for Glass Cannon.</li><li>Fixed a bug where Scoped Weapon family did not adapt the attack range increase when form-swapping champions swap form.</li><li>Fixed a bug where Typhoon fails to fire a missile when no enemy champions are in range.</li><li>Fixed a bug where Infernal Conduit base damage and scaling is higher than tooltip.</li><li>Fixed a bug where Volibear (R)'s turret-disabling debuff applied by the Echo Cast version visually refreshes while the duration does not.</li><li>Fixed a bug where Neeko regains bonus attack speed after exiting disguising when having Purist Caster.</li><li>Fixed a bug where Bel'Veth (E) fails to trigger Drop Kick's execution.</li><li>Fixed a bug where From Downtown's enemy VFX warning is bigger than intended.</li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-arena\">Arena</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><blockquote class=\"blockquote context\"><p>Hey Arenaheads! This Arena patch comes with many champion balance changes, primarily bringing up those that have been struggling for a while so that they get their chance in the spotlight, along with tapping down a few of the most dominant champions.<br><br>As for some exciting highlights, Rek'Sai's tunnels will have a 0 second used cooldown when maxed, allowing for some rapid in and out gameplay, Gnar's tired time is being removed so that you're constantly swapping back and forth, and Now You See Me level 2 spawns a clone where you vanished from.<br><br>Last but definitely not least, we're bringing back Bravery Arena! For the foreseeable future, Arena will be embracing Bravery and Crowd Favorites every Wednesday. For those that didn't get the chance to play during Bravery weekends, here's the rundown: On Wednesdays, each player will only be able to select Bravery, or choose from their pool of Crowd Favorite champions. The number of Crowd Favorites you're offered is based on how many champions you own.<br><br>We know that while a lot of people love Bravery, others enjoy picking from their pool of favorite champions. Our hope is that by having Bravery and Crowd Favorites at a consistent time players will be able to plan when they play to get the experience they are looking for, as well as being open to experimenting with new builds they might not have tried yet.</p></blockquote></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\"><strong>CHAMPIONS</strong></h4><h4 class=\"change-detail-title\">Aurelion Sol</h4><p><strong>Q - Breath of Light</strong></p><ul><li><strong>Burst Damage Health Ratio</strong>: 4% ⇒ <strong>3.1% Stardust%</strong></li></ul><hr class=\"divider\"><p><strong>E - Singularity</strong></p><ul><li><strong>Cooldown</strong>: 8 ⇒ <strong>12</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Bel'Veth</h4><p><strong>Passive - Death in Lavender</strong></p><ul><li><strong>Attack Speed Per Stack</strong>: 0.2%-2% ⇒ <strong>0.2%-1.5%</strong></li></ul><hr class=\"divider\"><p><strong>R - Endless Banquet</strong></p><ul><li><strong>Bonus Health</strong>: 250-450 ⇒ <strong>100-400</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Gnar</h4><p><strong>Passive - Rage Gene</strong></p><ul><li><strong>Tired Duration</strong>: 5s ⇒ <strong>0s</strong></li></ul><hr class=\"divider\"><p><strong>W - Hyper</strong></p><ul><li><strong>Mini Percent Health Damage</strong>: 6%-14% ⇒ <strong>10%-18%</strong></li></ul><hr class=\"divider\"><p><strong>E - Hop / Crunch</strong></p><ul><li><strong>Health Ratio</strong>: 6% ⇒ <strong>8%</strong></li><li><strong>Mini Attack Speed</strong>: 40%-60% ⇒ <strong>50%-70%</strong></li></ul><hr class=\"divider\"><p><strong>R - GNAR!</strong></p><ul><li><strong>Cooldown</strong>: 90-30 ⇒ <strong>70-30</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Heimerdinger</h4><p><strong>H-28 G Evolution Turret</strong></p><ul><li><strong>Q Base Damage</strong>: 4-12 ⇒ <strong>7-23</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">LeBlanc</h4><p><strong>Passive - Mirror Image</strong></p><ul><li><strong>Cooldown</strong>: 10s ⇒ <strong>5s</strong></li></ul><hr class=\"divider\"><p><strong>Q - Sigil of Malice</strong></p><ul><li><strong>Refund</strong>: 60% ⇒ <strong>100%</strong></li><li><strong>Base Damage</strong>: 85-185 ⇒ <strong>105-205</strong></li><li><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Damage Per Level Scaling</strong>: Now scales past level 18</li></ul><hr class=\"divider\"><p><strong>E - Ethereal Chains</strong></p><ul><li><strong>Cooldown</strong>: 14s-11s ⇒ <strong>12s-9s</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Mordekaiser</h4><p><strong>R - Realm of Death</strong></p><ul><li><strong>Stat Steal</strong>: 8% ⇒ <strong>10%</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Ornn</h4><p><strong>W - Bellows Breath</strong></p><ul><li><strong>Cooldown</strong>: 10s ⇒ <strong>11s-8.5s</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Poppy</h4><p><strong>Q - Hammer Shock</strong></p><ul><li><strong>Target Maximum Health Ratio</strong>: 8% ⇒ <strong>9%</strong></li></ul><hr class=\"divider\"><p><strong>W - Steadfast Presence</strong></p><ul><li><strong>Increased Resistances</strong>: 8%-16% ⇒ <strong>12%-24%</strong></li><li><strong>Cooldown</strong>: 26-16 ⇒ <strong>20-12</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Rek'Sai</h4><p><strong>Passive - Fury of the Xer'Sai</strong></p><ul><li><strong>Healing</strong>: 9%-20% ⇒ <strong>10%-45%</strong></li></ul><hr class=\"divider\"><p><strong>Q - Prey Seeker</strong></p><ul><li><strong>Cooldown</strong>: 10s ⇒ <strong>7.5s</strong></li></ul><hr class=\"divider\"><p><strong>W - Burrow</strong></p><ul><li><strong>Move Speed</strong>: 15-35 ⇒ <strong>20-60</strong></li></ul><hr class=\"divider\"><p><strong>E - Tunnel</strong></p><ul><li><strong>Tunnel Cooldown</strong>: 18s-14s ⇒ <strong>9s-5s</strong></li><li><strong>Tunnel Reuse Cooldown</strong>: 6s-2s ⇒ <strong>4s-0s</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Samira</h4><p><strong>R - Inferno Trigger</strong></p><ul><li><strong>Base Damage</strong>: 15-45 ⇒ <strong>20-60</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Shaco</h4><p><strong>Q - Deceive</strong></p><ul><li><strong>Bonus Attack Damage Ratio</strong>: 60% ⇒ <strong>85%</strong></li></ul><hr class=\"divider\"><p><strong>E - Two-Shiv Poison</strong></p><ul><li><strong>Bonus Attack Damage Ratio</strong>: 80% ⇒ <strong>100%</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Sona</h4><p><strong>Passive - Power Chord</strong></p><ul><li><strong>Stacks Per Round</strong>: 11.5 ⇒ <strong>10</strong></li></ul><hr class=\"divider\"><p><strong>W - Aria of Perseverance</strong></p><ul><li><strong>Cooldown</strong>: 10s ⇒ <strong>13s</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Soraka</h4><p><strong>W - Astral Infusion</strong></p><ul><li><strong>Cooldown</strong>: 6s-2s ⇒ <strong>7s-3s</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Swain</h4><p><strong>R - Demonic Ascension</strong></p><ul><li><strong>Heal Health Ratio</strong>: 1.5% ⇒ <strong>1%</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Varus</h4><p><strong>W - Blighted Quiver</strong></p><ul><li><strong>Cooldown</strong>: 40s ⇒ <strong>20s</strong></li></ul><hr class=\"divider\"><p><strong>E - Hail of Arrows</strong></p><ul><li><strong>Cooldown</strong>: 18s-10s ⇒ <strong>16s-8s</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Volibear</h4><p><strong>Q - Thundering Smash</strong></p><ul><li><strong>Bonus Attack Damage Ratio</strong>: 60% ⇒ <strong>100%</strong></li></ul><hr class=\"divider\"><p><strong>W - Frenzied Maul</strong></p><ul><li><strong>Damage Health Ratio</strong>: 5% ⇒ <strong>6%</strong></li><li><strong>Base Heal</strong>: 10-70 ⇒ <strong>20-80</strong></li><li><strong>Heal Health Ratio</strong>: 6%-14% ⇒ <strong>8%-20%</strong></li></ul><hr class=\"divider\"><p><strong>E - Sky Splitter</strong></p><ul><li><strong>Shield Health Ratio</strong>: 11% ⇒ <strong>14%</strong></li><li><strong>Shield Ability Power Ratio</strong>: 65% ⇒ <strong>75%</strong></li><li><strong>Base Damage</strong>: 60-160 ⇒ <strong>80-200</strong></li><li><strong>Percent Damage</strong>: 9%-13% ⇒ <strong>11%-15%</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">Warwick</h4><p><strong>Q - Jaws of the Beast</strong></p><ul><li><strong>Cooldown</strong>: 8s-6s ⇒ <strong>7s-5s</strong></li></ul><hr class=\"divider\"><p><strong>E - Primal Howl</strong></p><ul><li><strong>Cooldown</strong>: 15s-11s ⇒ <strong>13s-9s</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\"><strong>ITEMS</strong></h4><p><strong>Black Cleaver</strong></p><ul><li><strong>Attack Damage</strong>: 40 ⇒ <strong>45</strong></li><li><strong>Fervor Move Speed</strong>: 20 for 2s ⇒ <strong>[20 Melee || 15 Ranged] for 2s</strong></li></ul><hr class=\"divider\"><p><strong>Eclipse</strong></p><ul><li><strong>Damage</strong>: [6% Melee || 4% Ranged] Target Maximum Health ⇒ <strong>[8% Melee || 5% Ranged] Target Maximum Health</strong></li></ul><hr class=\"divider\"><p><strong>Sterak's Gage</strong></p><ul><li><strong>Bonus Attack Damage</strong>: 45% of Base Attack Damage ⇒ <strong>50% of Base Attack Damage</strong></li></ul><hr class=\"divider\"><p><strong>Sundered Sky</strong></p><ul><li><strong>Healing</strong>: [100% Melee || 50% Ranged] Base Attack Damage + 6% Missing Health ⇒ <strong>[90% Melee || 45% Ranged] Base Attack Damage + 4% Missing Health</strong></li><li><strong>Health</strong>: 350 ⇒ <strong>400</strong></li></ul><hr class=\"divider\"><p><strong>Void Immolation</strong></p><ul><li><strong>Aura Bonus Health Ratio</strong>: 7% ⇒ <strong>10%</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\"><strong>AUGMENTS</strong></h4><p><strong>Nesting Doll</strong></p><ul><li><strong>Time Until You Can Revive</strong>: 2 seconds ⇒ <strong>3 seconds</strong></li></ul><hr class=\"divider\"><p><strong>Now You See Me</strong></p><ul><li><span style=\"background-color:#53ad56;\"><strong>&nbsp; NEW &nbsp;</strong></span>&nbsp;<strong>Maximum Level Clone</strong>: At maximum level this leaves behind a clone at your previous location, lasts for 4 seconds</li><li><strong>Move Speed Boost</strong>: 50% / 75% ⇒ <strong>75%</strong></li></ul><hr class=\"divider\"><p><strong>Three Sacred Treasures</strong></p><ul><li><strong>Ability Power Ratio</strong>: 60% ⇒ <strong>50%</strong></li><li><strong>Attack Damage Ratio</strong>: 75% ⇒ <strong>60%</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\"><strong>BUGFIXES</strong></h4><ul><li>Fixed an issue where Combo breaker was triggering after 3s instead of 4s of being crowd controlled.</li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-bugfixes-and-qol-changes\">Bugfixes &amp; QoL Changes</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\"><strong>QoL CHANGES</strong></h4><ul><li>Reduced the volume of base Locke (Q) missile cast sound effects to better sit in the overall game mix.</li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\"><strong>BUGFIXES</strong></h4><ul><li>Fixed a bug where Viego with the Bot lane Role Quest would be able to steal his possessed target's boots.</li><li>Fixed a bug where upgrading from Hexdrinker to Maw of Malmortius did not reset the cooldown of the item.</li><li>Fixed a bug where killing a ward would display debug text for spectators.</li><li>Fixed a bug where Locke picking up his (R) artifact would refund based on its current cooldown instead of the total cooldown.</li><li>Fixed a bug where in certain circumstances Taunt and Berserk effects could be ignored using WASD controls.</li><li>Fixed a bug where Support players' Control wards would be consumed when trying to place them while dead.</li><li>Fixed a bug where Ambessa's omnivamp would apply on turrets when driving Rift Herald into them.</li><li>Fixed a bug where Mordekaiser (R) improperly gains Ability Haste.</li><li>Fixed a bug where Bel'Veth's resource bar would incorrectly update if she hit 80 stacks while already in True Form.</li><li>Fixed a bug where Locke (R) execution would be considered a spell cast.</li><li>Fixed a bug where Viktor (R) lightning VFX would stretch across the screen in certain situations.</li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-upcoming-skins-and-chromas\">Upcoming Skins &amp; Chromas</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><p>The following skins will be released in this patch:</p><div class=\"gs-container default-2-col\"><div class=\"skin-box\"><p><a class=\"skins cboxElement\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/e68f31a74579ce085c3de6798f56a26cc04f9767-1920x1080.jpg\"><span class=\"content-border\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/e68f31a74579ce085c3de6798
